<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDECE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A24" media="(prefers-color-scheme: dark)">
<meta name="description" content="A personal to-do list that works offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" id="iosTitle" content="">
<title>To do list</title>

<!-- Language is applied before first paint so an Arabic user never sees an LTR flash.
     This is the only place the language is detected; the app reads it back from <html>. -->
<script>
try {
  var saved = localStorage.getItem("todo.lang");
  if (saved !== "ar" && saved !== "en") {
    saved = (navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en";
  }
  document.documentElement.lang = saved;
  document.documentElement.dir = saved === "ar" ? "rtl" : "ltr";
} catch (e) { /* storage blocked: stay with the English default */ }
</script>

<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root{
  color-scheme:light;
  /* Three stops sampled straight from the logo: the swoosh runs deep -> sky */
  --brand-deep:#16324F;
  --brand-mid:#2C5578;
  --brand-sky:#5DA6C8;

  --bg:#EDECE7;              /* the logo's paper */
  --surface:#FFFFFF;
  --ink:#182E46;             /* wordmark navy */
  --muted:#64717F;
  --line:#E2E1DA;
  --accent:var(--brand-mid); /* blue = you can act on this */
  --accent-strong:#22466A;
  --accent-soft:#E4EBF2;
  --on-accent:#FFFFFF;
  --done-bg:#F4F8FB;         /* finished work recedes */
  --danger:#A0564E;          /* the only warm hue: destructive actions */
  --danger-soft:#F6E9E7;

  --r-lg:18px;
  --r-md:12px;
  --tap:48px;
  --pad:14px;
  --gap:10px;
  --fs:16px;                       /* 16px min: stops iOS zooming on focus */
}
html[lang="ar"]{--fs:17px}         /* Arabic needs slightly more optical size */

/* Same system, re-lit for dark rooms. Every pair below was contrast-checked. */
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --brand-deep:#3E7BA8;
    --brand-sky:#9AD0EA;
    --bg:#0F1A24;
    --surface:#16232F;
    --ink:#E7EDF3;
    --muted:#93A3B3;
    --line:#26374A;
    --accent:#7CB2D8;
    --accent-strong:#9AC6E4;
    --accent-soft:#1D3446;
    --on-accent:#0F1A24;     /* light blue needs dark text on it, not white */
    --done-bg:#131E29;
    --danger:#D9938A;
    --danger-soft:#2E2020;
  }
}
@media (min-width:600px){
  :root{--pad:20px;--gap:12px;--fs:17px}
  html[lang="ar"]{--fs:18px}
}

/* ============================================================
   2. BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}   /* a class with its own display must never outrank this */
html,body{height:100%}
body{
  overflow:hidden;                 /* the page itself never scrolls */
  overscroll-behavior:none;        /* no pull-to-refresh or rubber-banding */
  display:flex;
  justify-content:center;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic",Tahoma,sans-serif;
  font-size:var(--fs);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
html[lang="ar"] body{line-height:1.7}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ============================================================
   3. SHELL — one screen, three rows
   ============================================================ */
.app{
  width:100%;
  max-width:660px;
  height:100vh;
  height:100dvh;
  height:var(--app-h,100dvh);      /* set from the visual viewport when available */
  display:flex;
  flex-direction:column;
  gap:var(--gap);
  padding:calc(var(--pad) + env(safe-area-inset-top))
          max(var(--pad),env(safe-area-inset-right))
          calc(var(--pad) + env(safe-area-inset-bottom))
          max(var(--pad),env(safe-area-inset-left));
}

/* Deliberately outside the brand block, so a rebranded copy keeps it */
.dua{
  flex:none;
  text-align:center;
  font-size:.7rem;
  line-height:1.7;
  color:var(--muted);
  opacity:.72;
}

.tabs{display:flex;gap:6px;flex:none}
.tab{
  flex:1;
  min-height:38px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  color:var(--muted);
  font-size:.85rem;
  font-weight:600;
}
.tab[aria-selected="true"]{
  background:var(--accent-soft);
  color:var(--accent);
  border-color:var(--accent-soft);
}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--gap)}
.view[hidden]{display:none}

.city-hit{cursor:pointer}
@media (hover:hover){.city-hit:hover{background:var(--done-bg)}}
.city-hit:active{background:var(--done-bg)}
/* Two class names, so this beats the plain .composer__add rule further down */
.composer__add.composer__add--quiet{
  background:var(--surface);
  color:var(--muted);
  border:1px solid var(--line);
  min-width:96px;
  font-size:.82rem;
  font-weight:600;
}
.composer__add.composer__add--quiet[aria-pressed="true"]{
  background:var(--accent);                       /* on is the loud state, not the quiet one */
  color:var(--on-accent);
  border-color:var(--accent);
}

.prayer{display:flex;align-items:center;gap:12px;min-height:56px;padding:4px 14px;border-bottom:1px solid var(--line)}
.prayer:last-of-type{border-bottom:0}
.prayer__name{flex:1;font-size:1.02rem}
.prayer__time{font-variant-numeric:tabular-nums;font-size:1.02rem;color:var(--muted)}
.prayer.is-next{background:var(--done-bg)}
.prayer.is-next .prayer__name{font-weight:650;color:var(--accent)}
.prayer.is-next .prayer__time{color:var(--accent);font-weight:650}
.prayer__note{padding:14px;font-size:.76rem;color:var(--muted);text-align:center}

.goal{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.goal__text{overflow-wrap:anywhere;line-height:1.35}
.goal.is-done .goal__text{color:var(--muted);text-decoration:line-through}
.goal__due{font-size:.76rem;color:var(--muted);text-align:start;background:none;border:0;padding:0;cursor:pointer}
.goal__due.is-late{color:var(--danger);font-weight:600}
.goal__due.is-empty{color:var(--accent)}
.goal__date{
  flex:1;min-width:0;height:34px;padding-inline:6px;font:inherit;font-size:.8rem;
  border:1px solid var(--accent);border-radius:8px;background:var(--surface);color:var(--ink);
}
.goal__step{font-size:.82rem;color:var(--accent);text-align:start;cursor:pointer}
.goal__step.is-empty{color:var(--muted);font-weight:400}
.goal__edit{
  width:100%;height:34px;padding-inline:8px;font:inherit;font-size:.85rem;
  border:1px solid var(--accent);border-radius:8px;background:var(--surface);color:var(--ink);
}
.goal__edit[hidden]{display:none}
.edit__tags{display:flex;gap:8px;font-size:.72rem;color:var(--muted)}
.edit__tags span{flex:1;min-width:0}
.edit__tags span:nth-child(3){flex:none;width:96px}
.goal.is-editing .goal__step{display:none}

/* ============================================================
   4. HEADER
   ============================================================ */
.header{display:flex;align-items:center;justify-content:space-between;gap:var(--gap)}
/* Logo lockup: monogram, then the name over the tagline.
   Images are never mirrored in RTL — the whole block just moves to the right. */
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand picture{display:block}
.brand img{
  display:block;height:100%;width:auto;
  user-select:none;-webkit-user-drag:none;
  -webkit-touch-callout:none;      /* a long press must not open the image menu */
}
.brand__text{cursor:pointer}
.brand__mark{height:clamp(30px,8.4vw,36px)}
.brand__word{height:clamp(14px,3.8vw,17px)}
.brand__word[hidden]{display:none}
.brand__mark[hidden]{display:none}
.brand__name{                      /* used when a brand has no wordmark image */
  font-size:clamp(1.05rem,4.4vw,1.3rem);
  font-weight:650;
  line-height:1.1;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.brand__name[hidden]{display:none}
.brand__edit{
  width:9ch;
  height:26px;
  padding-inline:6px;
  border:1px solid var(--accent);
  border-radius:7px;
  background:var(--surface);
  color:var(--ink);
  font:inherit;
  font-size:clamp(.95rem,3.8vw,1.15rem);
  font-weight:650;
}
.brand__edit[hidden]{display:none}
.brand__text{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand__tag{
  font-size:clamp(10px,2.7vw,11px);
  font-weight:600;
  line-height:1;
  letter-spacing:.2em;             /* echoes the spacing in the original logo */
  color:var(--accent);
  white-space:nowrap;
}
html[lang="ar"] .brand__tag{
  font-size:clamp(11px,3.1vw,12.5px);
  letter-spacing:normal;           /* tracking breaks Arabic letter joining */
  font-weight:500;
}
.header__tools{display:flex;align-items:center;gap:6px;flex:none}
.tool-btn{
  flex:none;
  width:40px;height:40px;
  display:grid;place-items:center;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  color:var(--accent);
}
.tool-btn svg{
  width:19px;height:19px;
  fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;
}
@media (hover:hover){.tool-btn:hover{background:var(--accent-soft)}}
.tool-btn:active{background:var(--accent-soft)}

.tool-btn--text{font-size:.95rem;font-weight:700;line-height:1;letter-spacing:.02em}

/* ============================================================
   5. COMPOSER
   ============================================================ */
.composer{display:flex;gap:8px}
.composer__field{position:relative;display:flex;flex:1;min-width:0}
.composer__input{
  flex:1;
  min-width:0;
  padding-inline-end:46px;         /* room for the date control */
  height:var(--tap);
  padding-inline:16px;
  border:1px solid var(--line);
  border-radius:var(--r-md);
  background:var(--surface);
  text-align:start;
}
.composer__input::placeholder{color:var(--muted)}

/* A real date input, made invisible over its own icon: native picker, no library */
.composer__date{
  position:absolute;inset-inline-end:0;top:0;
  width:46px;height:100%;
  opacity:0;
  border:0;padding:0;background:none;
  -webkit-appearance:none;appearance:none;
  cursor:pointer;
}
.composer__cal{
  position:absolute;inset-inline-end:13px;top:50%;
  transform:translateY(-50%);
  width:20px;height:20px;
  pointer-events:none;
  fill:none;stroke:var(--muted);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
.composer__field.has-date .composer__cal{stroke:var(--accent)}
.composer__date:focus-visible + .composer__cal{stroke:var(--accent)}
.composer__input:focus{outline:none;border-color:var(--accent)}
.composer__add{
  flex:none;
  height:var(--tap);
  min-width:84px;
  padding-inline:18px;
  border-radius:var(--r-md);
  background:var(--accent);
  color:var(--on-accent);
  font-weight:600;
}
@media (hover:hover){.composer__add:hover{background:var(--accent-strong)}}
.composer__add:active{background:var(--accent-strong)}

/* ============================================================
   6. TASK PANEL — the only scrollable region
   ============================================================ */
.panel{
  flex:1;
  min-height:0;                    /* lets the panel shrink instead of pushing the page */
  display:flex;
  flex-direction:column;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  overflow:hidden;                 /* keeps the progress line inside the rounded corners */
}

/* The logo's swoosh, reused as the one place colour reports state:
   how much of the list is done. No numbers, no labels. */
.progress{flex:none;height:3px;background:var(--line)}
.progress__fill{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--brand-deep),var(--brand-sky));
  transition:width .16s ease;
}
html[dir="rtl"] .progress__fill{transform:scaleX(-1)}   /* grows from the right */

.scroller{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:var(--line) transparent;
}
.scroller::-webkit-scrollbar{width:6px}
.scroller::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* One inline bar, reused by every transient message the app has */
.strip{
  flex:none;
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  background:var(--accent-soft);
  font-size:.85rem;
}
.strip[hidden]{display:none}
.strip__text{flex:1 1 150px;min-width:0}
.strip__actions{display:flex;flex-wrap:wrap;gap:6px;margin-inline-start:auto}
.strip__btn{
  min-height:38px;
  padding-inline:12px;
  border-radius:9px;
  font-weight:600;
  color:var(--accent);
  white-space:nowrap;
}
.strip__btn--main{background:var(--accent);color:var(--on-accent)}

.list{list-style:none}
.empty{margin:auto;padding:32px 24px;text-align:center;color:var(--muted);
  display:flex;flex-direction:column;gap:10px}
.empty__hint{font-size:.82rem;color:var(--muted)}
.empty__mood{
  font-size:1.02rem;
  line-height:1.6;
  color:var(--ink);
  max-width:22ch;
  margin-inline:auto;
}
.empty__hint{margin-top:10px;font-size:.85rem;color:var(--muted)}
.empty[hidden]{display:none}

/* Shown once, in the space the empty list already leaves free */
.welcome{
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:24px;
  width:100%;
  max-width:320px;
  text-align:center;
}
.welcome[hidden]{display:none}
.welcome__hi{font-size:1.15rem;font-weight:650;color:var(--ink)}
.welcome__q{font-size:.9rem;color:var(--muted)}
.welcome__row{display:flex;gap:8px}
.welcome__row .fld{height:46px;text-align:center}
.linkbtn--go{flex:none;background:var(--accent);color:var(--on-accent);border-color:var(--accent);min-width:76px}
.linkbtn--quiet{border:0;background:none;color:var(--muted);font-weight:500}

.task{
  display:flex;
  flex-wrap:wrap;                  /* lets the date field drop to its own line when editing */
  align-items:center;
  gap:8px;
  min-height:56px;
  padding:4px 10px;
  border-bottom:1px solid var(--line);
}
.task:last-child{border-bottom:0}
@media (min-width:600px){.task{padding-inline:16px;gap:10px}}

/* Checkbox */
.check{
  flex:none;
  width:24px;height:24px;
  appearance:none;-webkit-appearance:none;
  border:2px solid var(--muted);
  border-radius:7px;
  background:var(--surface);
  cursor:pointer;
  position:relative;
}
.check:checked{                            /* the swoosh gradient means "done" */
  background-image:linear-gradient(135deg,var(--brand-deep),var(--brand-sky));
  border-color:var(--brand-mid);
}
.check:checked::after{                     /* direction-neutral: centred, never mirrored */
  content:"";
  position:absolute;
  top:50%;left:50%;
  width:5px;height:10px;
  border:solid var(--on-accent);
  border-width:0 2px 2px 0;
  transform:translate(-50%,-58%) rotate(45deg);
}

/* Task text / inline edit field */
.task__body{
  flex:1;
  cursor:pointer;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:1px;
  padding-block:9px;
}
.task__text{
  text-align:start;
  overflow-wrap:anywhere;
  line-height:1.35;
}

/* How near the date is decides its colour: overdue, due now, or simply noted */
.task__due{
  font-size:.76rem;
  line-height:1.35;
  text-align:start;
  color:var(--muted);
}
.task__due[hidden]{display:none}
.task__due.is-today{color:var(--accent);font-weight:600}
.task__due.is-late{color:var(--danger);font-weight:600}
.task.is-done .task__due{color:var(--muted);font-weight:400}

.sr-only{
  position:absolute;width:1px;height:1px;
  padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* An important task keeps its mark in the margin: no width taken from the text */
.task{position:relative}
.task.is-important::before{
  content:"";
  position:absolute;inset-block:0;inset-inline-start:0;
  width:3px;
  background:var(--accent);
}

/* The number doubles as the priority mark: one element, two facts */
.task__no{
  flex:none;
  min-width:1.1em;
  font-size:.7rem;
  text-align:end;
  font-size:.74rem;
  font-variant-numeric:tabular-nums;
  color:var(--muted);
  opacity:.75;
}
.task.is-high .task__no{color:var(--accent);font-weight:700;opacity:1}
.task.is-low .task__no{opacity:.4}
.task.is-done .task__no{opacity:.4;color:var(--muted);font-weight:400}

.task__plan{font-size:.74rem;color:var(--muted)}
.task__plan[hidden]{display:none}

/* Edit panel — the one place every extra option lives */
.edit{
  flex-basis:100%;
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-block:2px 10px;
}
.edit__row{display:flex;gap:8px}
.fld{
  flex:1;
  min-width:0;
  height:40px;
  padding-inline:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  color:var(--ink);
  font:inherit;
}
.fld--time{flex:none;width:96px}
.fld--num{flex:none;width:96px}
.fld:focus{outline:none;border-color:var(--accent)}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg__btn{
  flex:1;
  min-height:38px;
  font-size:.82rem;
  font-weight:600;
  color:var(--muted);
  background:var(--surface);
  border-inline-end:1px solid var(--line);
}
.seg__btn:last-child{border-inline-end:0}
.seg__btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.plan{display:flex;flex-direction:column;gap:6px}
.plan__head{display:flex;align-items:center;gap:8px}
.plan__label{flex:1;font-size:.78rem;color:var(--muted)}
.linkbtn{
  min-height:36px;
  padding-inline:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  color:var(--accent);
  font-size:.82rem;
  font-weight:600;
}
.linkbtn--box{flex:none;width:44px;padding:0;font-size:1.1rem}
.linkbtn--wide{width:100%}
.plan__list{list-style:none;display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:8px}
.step__text{height:36px;font-size:.88rem}
.step .check--sm{width:20px;height:20px;border-radius:6px}
.step .check--sm:checked::after{width:4px;height:8px;border-width:0 2px 2px 0}
.icon-btn--sm{width:34px;height:34px}
.icon-btn--sm svg{width:16px;height:16px}
.step.is-done .step__text{color:var(--muted);text-decoration:line-through}
.task__star{
  flex:none;
  width:40px;height:40px;
  display:grid;place-items:center;
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--muted);
}
.task__star svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.task__star[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.task__star[aria-pressed="true"] svg{fill:currentColor}

.task__time-edit{
  flex:none;
  width:96px;
  height:40px;
  padding-inline:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  color:var(--ink);
}
.task__due-edit{
  flex:1;
  min-width:0;
  height:40px;
  padding-inline:12px;
  border:1px solid var(--accent);
  border-radius:10px;
  background:var(--surface);
  color:var(--ink);
}

.task__text.is-translated{               /* honest marker: these are not your words */
  text-decoration:underline dotted var(--muted);
  text-underline-offset:3px;
}
.task.is-done{background:var(--done-bg)}
.task.is-done .task__text{color:var(--muted);text-decoration:line-through}
.task__edit{
  display:none;
  flex:1;
  min-width:0;
  height:40px;
  padding-inline:12px;
  border:1px solid var(--accent);
  border-radius:10px;
  background:var(--surface);
  text-align:start;
}
.task__edit:focus{outline:none}
.task.is-editing .task__body{display:none}
.task.is-editing .task__edit{display:block}

/* Row buttons */
.task__actions{display:flex;flex:none}
.icon-btn{
  width:44px;height:44px;         /* the recommended minimum: never traded for text width */
  display:grid;place-items:center;
  border-radius:10px;
  color:var(--muted);
}
.icon-btn svg{
  width:20px;height:20px;
  fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}
.icon-save,.task.is-editing .icon-edit{display:none}
.task.is-editing .icon-save{display:block}
.task.is-editing .btn-edit{color:var(--accent);background:var(--accent-soft)}
@media (hover:hover){
  .btn-edit:hover{color:var(--accent);background:var(--accent-soft)}
  .btn-delete:hover{color:var(--danger);background:var(--danger-soft)}
}
.btn-edit:active{color:var(--accent);background:var(--accent-soft)}
.btn-delete:active{color:var(--danger);background:var(--danger-soft)}

/* ============================================================
   8. MOTION PREFERENCE
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    animation:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<main class="app">

  <header class="header">
    <h1 class="brand">
      <picture class="brand__mark">
        <source id="markDark" media="(prefers-color-scheme: dark)">
        <img id="brandMark" alt="">
      </picture>
      <span class="brand__text">
        <picture class="brand__word" id="brandWordBox">
          <source id="wordDark" media="(prefers-color-scheme: dark)">
          <img id="brandWord" alt="">
        </picture>
        <span class="brand__name" id="brandName" hidden></span>
        <input class="brand__edit" id="brandEdit" maxlength="24" hidden>
        <span class="brand__tag" id="brandTag"></span>
      </span>
    </h1>
    <span class="header__tools">
      <button class="tool-btn" id="installBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="2.5" width="12" height="19" rx="2.5"/>
          <path d="M12 7.5v6.5"/><path d="m9.2 11.2 2.8 2.8 2.8-2.8"/>
        </svg>
      </button>
      <button class="tool-btn" id="backupBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"/><path d="m8 11 4 4 4-4"/><path d="M5 19h14"/></svg>
      </button>
      <button class="tool-btn tool-btn--text" id="langBtn" type="button">ع</button>
    </span>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab" type="button" data-tab="tasks" aria-selected="true"></button>
    <button class="tab" type="button" data-tab="prayer" aria-selected="false"></button>
    <button class="tab" type="button" data-tab="goals" aria-selected="false"></button>
  </nav>

  <section class="view" id="viewTasks">
  <div class="composer">
    <span class="composer__field" id="composerField">
      <input class="composer__input" id="taskInput" type="text" maxlength="200"
             autocomplete="off" autocorrect="off" enterkeyhint="done" placeholder="What needs doing?">
      <input class="composer__date" id="taskDue" type="date">
      <svg class="composer__cal" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>
      </svg>
    </span>
    <button class="composer__add" id="addBtn" type="button">Add</button>
  </div>

  <section class="panel">
    <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <i class="progress__fill" id="progressFill"></i>
    </div>
    <div class="strip" id="strip" role="status" hidden>
      <p class="strip__text" id="stripText"></p>
      <span class="strip__actions">
        <button class="strip__btn strip__btn--main" id="stripMain" type="button" hidden></button>
        <button class="strip__btn" id="stripAlt" type="button" hidden></button>
        <button class="strip__btn" id="stripExtra" type="button" hidden></button>
      </span>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div class="scroller" id="scroller">
      <ul class="list" id="taskList" role="list"></ul>
      <div class="empty" id="emptyState" role="status" hidden>
        <p class="empty__mood" id="emptyMood"></p>
        <p class="empty__hint" id="emptyHint"></p>
      </div>
      <div class="welcome" id="welcome" hidden>
        <p class="welcome__hi" id="welcomeHi"></p>
        <label class="welcome__q" id="welcomeQ" for="welcomeName"></label>
        <div class="welcome__row">
          <input class="fld" id="welcomeName" maxlength="24" autocomplete="name" enterkeyhint="done">
          <button class="linkbtn linkbtn--go" id="welcomeGo" type="button"></button>
        </div>
        <button class="linkbtn linkbtn--quiet" id="welcomeSkip" type="button"></button>
      </div>
    </div>
  </section>
  </section>

  <section class="view" id="viewPrayer" hidden>
    <div class="composer">
      <input class="composer__input" id="cityPick" type="text" autocomplete="off"
             enterkeyhint="search" aria-label="City">
      <button class="composer__add composer__add--quiet" id="athanBtn" type="button"></button>
    </div>
    <section class="panel">
      <ul class="list" id="prayerList"></ul>
      <ul class="list" id="cityList" hidden></ul>
      <p class="prayer__note" id="prayerNote"></p>
      <p class="empty" id="cityEmpty" role="status" hidden></p>
    </section>
  </section>

  <section class="view" id="viewGoals" hidden>
    <div class="composer">
      <span class="composer__field" id="goalField">
        <input class="composer__input" id="goalInput" type="text" maxlength="80"
               autocomplete="off" enterkeyhint="done">
        <input class="composer__date" id="goalDue" type="date">
        <svg class="composer__cal" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>

      </span>
      <button class="composer__add" id="goalAdd" type="button"></button>
    </div>
    <section class="panel">
      <ul class="list" id="goalList"></ul>
      <p class="empty" id="goalEmpty" role="status" hidden></p>
    </section>
  </section>

  <p class="sr-only" id="live" role="status" aria-live="polite"></p>
</main>

<!-- Row blueprint: cloned per task, so no markup is ever built from strings -->
<template id="rowTemplate">
  <li class="task">
    <span class="task__no"></span>
    <input class="check" type="checkbox" data-action="toggle">
    <span class="task__body" data-action="open">
      <span class="task__text"></span>
      <span class="task__due" hidden><span class="sr-only"></span><span></span></span>
      <span class="task__plan" hidden></span>
    </span>
    <input class="task__edit" type="text" maxlength="200" autocomplete="off" enterkeyhint="done">
    <div class="task__actions">
      <button class="icon-btn btn-edit" type="button" data-action="edit">
        <svg class="icon-edit" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16v4Z"/><path d="m14 6 4 4"/></svg>
        <svg class="icon-save" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4 4 10-10"/></svg>
      </button>
      <button class="icon-btn btn-delete" type="button" data-action="delete">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>
      </button>
    </div>
  </li>
</template>

<!-- Everything that is not the task text lives here, and only for the row being
     edited: native date inputs are costly, and one row edits at a time -->
<template id="editTemplate">
  <div class="edit">
    <div class="edit__row">
      <input class="fld" type="date" data-f="due">
      <input class="fld fld--time" type="time" data-f="at">
    </div>
    <div class="edit__row">
      <select class="fld" data-f="repeat">
        <option value="none"></option><option value="hourly"></option>
        <option value="daily"></option><option value="weekly"></option>
        <option value="custom"></option>
      </select>
      <input class="fld fld--num" type="number" min="5" max="10080" step="5" data-f="every" hidden>
    </div>
    <div class="seg" data-role="prio">
      <button class="seg__btn" type="button" data-action="prio" data-v="high"></button>
      <button class="seg__btn" type="button" data-action="prio" data-v="normal"></button>
      <button class="seg__btn" type="button" data-action="prio" data-v="low"></button>
    </div>
    <div class="plan">
      <div class="plan__head">
        <span class="plan__label"></span>
        <button class="linkbtn" type="button" data-action="suggest"></button>
      </div>
      <ul class="plan__list" data-role="steps"></ul>
      <div class="edit__row">
        <input class="fld" data-f="newstep" maxlength="120">
        <button class="linkbtn linkbtn--box" type="button" data-action="addstep">+</button>
      </div>
    </div>
    <button class="linkbtn linkbtn--wide" type="button" data-action="share"></button>
  </div>
</template>

<!-- Everything a goal can carry, and every field of it optional -->
<template id="goalEditTemplate">
  <div class="edit">
    <div class="edit__tags">
      <span data-gt="start"></span><span data-gt="end"></span><span data-gt="at"></span>
    </div>
    <div class="edit__row">
      <input class="fld" type="date" data-gf="start">
      <input class="fld" type="date" data-gf="due">
      <input class="fld fld--time" type="time" data-gf="at">
    </div>
    <input class="fld" data-gf="step" maxlength="120">
  </div>
</template>

<template id="stepTemplate">
  <li class="step">
    <input class="check check--sm" type="checkbox" data-action="stepdone">
    <input class="fld step__text" data-f="steptext" maxlength="120">
    <button class="icon-btn icon-btn--sm" type="button" data-action="stepdel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </li>
</template>

  /* ==========================================================
     2. STORAGE — never throws; the app stays usable if it fails
     ========================================================== */
  function read(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function write(key, value) {
    try { window.localStorage.setItem(key, value); } catch (e) { /* private mode or quota */ }
  }

  function loadTasks() {
    try { return normalize(JSON.parse(read(TASKS_KEY) || "[]")); }
    catch (e) { return []; }                       // corrupt JSON: start clean
  }

  /* Every task that enters the app — from storage or from a restored file —
     passes through here, so no external file can inject an unexpected shape. */
  function normalize(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.reduce(function (list, item) {
        const text = item && typeof item.text === "string" ? item.text.trim() : "";
        if (text) {
          const tr = {};
          if (item.tr && typeof item.tr === "object") {
            if (typeof item.tr.en === "string") tr.en = item.tr.en.slice(0, MAX_LEN * 2);
            if (typeof item.tr.ar === "string") tr.ar = item.tr.ar.slice(0, MAX_LEN * 2);
          }
          const clean = text.slice(0, MAX_LEN);
          list.push({
            due: validDue(item.due),
            at: validTime(item.at),
            priority: PRIORITIES.indexOf(item.priority) >= 0 ? item.priority
                      : (item.important === true ? "high" : "normal"),   // upgrades old lists
            repeat: REPEATS.indexOf(item.repeat) >= 0 ? item.repeat : "none",
            every: Number.isFinite(item.every) && item.every >= 5 ? Math.min(10080, Math.round(item.every)) : null,
            plan: normalizePlan(item.plan),
            id: item.id && typeof item.id === "string" ? item.id : createId(),
            text: clean,
            done: item.done === true,
            lang: item.lang === "ar" || item.lang === "en" ? item.lang : detect(clean),
            tr: tr
          });
        }
        return list;
      }, []);
  }

  function normalizePlan(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.reduce(function (list, step) {
      const text = step && typeof step.text === "string" ? step.text.trim() : "";
      if (text) list.push({ id: step.id && typeof step.id === "string" ? step.id : createId(),
                            text: text.slice(0, 120), done: step.done === true });
      return list;
    }, []).slice(0, 20);
  }

  function saveTasks() { write(TASKS_KEY, JSON.stringify(state.tasks)); }

  function createId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ==== BRAND END ========================================================= */

  const ICON_192 = BRAND.icon192;
  const ICON_512 = BRAND.icon512;
  const ICON_MASK = BRAND.iconMask;

  let manifestLink = null;
  let manifestBody = null;

  function addLink(rel, href, type) {
    const link = document.createElement("link");
    link.rel = rel;
    link.href = href;
    if (type) link.type = type;
    document.head.appendChild(link);
    return link;
  }

  /* The installed icon should read the same name the person is looking at */
  function updateManifest() {
    if (!manifestLink || !manifestBody) return;
    manifestBody.name = hasOwner() ? ownerName() + " " + (BRAND.tagline[state.lang] || BRAND.tagline.en)
                                   : ownerName();
    manifestBody.short_name = ownerName();
    manifestLink.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifestBody));
    const ios = document.getElementById("iosTitle");
    if (ios) ios.content = ownerName();
  }

  let swReg = null;

  /* Stored as {en, ar}. Older copies stored a single string, which becomes both. */
  function loadOwner() {
    const raw = read(OWNER_KEY);
    if (!raw) return { en: "", ar: "" };
    try {
      const saved = JSON.parse(raw);
      if (saved && typeof saved === "object") {
        return { en: cleanName(saved.en), ar: cleanName(saved.ar) };
      }
    } catch (e) { /* a plain string from an older version */ }
    const one = cleanName(raw);
    return { en: one, ar: one };
  }

  function saveOwner() { write(OWNER_KEY, JSON.stringify(state.owner)); }

  function hasOwner() { return !!(state.owner.en || state.owner.ar); }

  function cleanName(value) {
    return String(value || "").replace(/[\u0000-\u001F<>]/g, "").trim().slice(0, 24);
  }

  /* A link like ?name=Rahaf hands this copy to someone, once. After that the
     device remembers, so the person can rename it themselves and keep it. */
  function resolveOwner() {
    let en = "", ar = "";
    try {
      const q = new URLSearchParams(location.search);
      en = cleanName(q.get("name"));
      ar = cleanName(q.get("ar"));
    } catch (e) { /* no query to read */ }
    if ((en || ar) && !hasOwner()) {               // a link only names an unnamed device
      state.owner = { en: en || ar, ar: ar || en };
      saveOwner();
    }
    if (en || ar) {                                // keep the address clean afterwards
      try { history.replaceState({}, "", location.pathname + location.hash); } catch (e) { /* file:// */ }
    }
  }

  function ownerName() {
    return state.owner[state.lang] || state.owner.en || state.owner.ar ||
           BRAND.name[state.lang] || BRAND.name.en;
  }

  function startRename() {
    el.brandEdit.value = state.owner[state.lang] || "";
    el.brandEdit.placeholder = t().whoseName;
    el.brandEdit.setAttribute("aria-label", t().whoseName);
    el.brandEdit.hidden = false;
    el.brandName.hidden = true;
    el.logoBox.hidden = true;
    el.brandEdit.focus();
    el.brandEdit.select();
  }

  /* Renaming touches the language you are looking at, and leaves the other alone */
  function setOwner(value) {
    const name = cleanName(value);
    if (name) state.owner[state.lang] = name;
    else state.owner = { en: "", ar: "" };         // clearing hands the copy back to the brand
    saveOwner();
    paintBrand();
    renderChrome();
    updateManifest();
  }

  function paintBrand() {
    const ios = document.getElementById("iosTitle");
    if (ios) ios.content = ownerName();             // home-screen label on iOS
    if (BRAND.mark) {
      el.mark.src = BRAND.mark;
      el.markDark.srcset = BRAND.markDark || BRAND.mark;
      el.mark.parentElement.hidden = false;
    } else {
      el.mark.parentElement.hidden = true;         // a name-only brand: type carries it
    }
    if (BRAND.word && !hasOwner()) {               // the brand's own wordmark, unless this
      el.logo.src = BRAND.word;                    // copy belongs to someone by name
      el.logoDark.srcset = BRAND.wordDark || BRAND.word;
      el.logoBox.hidden = false;
      el.brandName.hidden = true;
    } else {                                       // no wordmark: set the name in type
      el.logoBox.hidden = true;
      el.brandName.hidden = false;
    }
  }

  function setupPWA() {
    addLink("icon", ICON_192, "image/png");
    addLink("apple-touch-icon", ICON_192);

    // The manifest is generated here so the whole app stays in one file.
    // A data: manifest cannot resolve relative URLs, so every URL is absolute.
    const here = location.href.split("#")[0];
    const manifest = manifestBody = {
      id: here,
      name: hasOwner() ? ownerName() + " " + (BRAND.tagline[state.lang] || BRAND.tagline.en)
                       : ownerName(),
      short_name: ownerName(),
      description: "A personal to-do list. Works offline.",
      start_url: here,
      scope: here.replace(/[^/]*$/, ""),
      display: "standalone",
      background_color: "#EDECE7",
      theme_color: "#EDECE7",
      icons: [
        { src: ICON_192, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: ICON_512, sizes: "512x512", type: "image/png", purpose: "any" },
        { src: ICON_MASK, sizes: "512x512", type: "image/png", purpose: "maskable" }
      ]
    };
    manifestLink = addLink("manifest", "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest)));

    // Optional: if sw.js sits next to this file, it adds offline support when
    // hosted. Opened from disk or installed, the app is already self-contained.
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      navigator.serviceWorker.register("sw.js")
        .then(function (reg) { swReg = reg; syncReminders(); })
        .catch(function () { /* not deployed: reminders fall back to timers */ });
    }
  }

  /* ==========================================================
     6. RENDER
     ========================================================== */
  function renderChrome() {
    const s = t();
    el.root.lang = state.lang;
    el.root.dir = s.dir;
    const name = ownerName();
    const tag = BRAND.tagline[state.lang] || BRAND.tagline.en;
    document.title = hasOwner() ? name + " — " + tag : name;
    el.logo.alt = name;
    el.brandName.textContent = name;
    el.tagline.textContent = tag;
    el.tagline.hidden = !hasOwner();               // with no name, the title is the app itself
    el.langBtn.textContent = s.switchTo;
    el.langBtn.setAttribute("aria-label", s.switchLabel);
    el.installBtn.setAttribute("aria-label", s.install);
    el.installBtn.title = s.install;
    el.backupBtn.setAttribute("aria-label", s.backup);
    el.backupBtn.title = s.backup;

    el.input.placeholder = s.placeholder;
    el.addBtn.textContent = s.add;
    // the empty area now holds two elements; renderList fills them
  }

  function renderList() {
    const s = t();
    const focus = captureFocus();
    const frag = document.createDocumentFragment();

    rows.clear();
    editField = null;
    editDue = null;
    editTime = null;
    editPanel = null;

    const q = query();
    const visible = ordered().filter(function (task) { return matches(task, q); });

    for (let i = 0; i < visible.length; i++) {
      const task = visible[i];
      const editing = task.id === state.editingId;
      const row = el.tpl.content.firstElementChild.cloneNode(true);
      const number = row.children[0];
      const check = row.children[1];
      const body = row.children[2];
      const text = body.children[0];
      const dueChip = body.children[1];
      const planChip = body.children[2];
      const field = row.children[3];
      const editBtn = row.children[4].children[0];
      const delBtn = row.children[4].children[1];
      number.textContent = i + 1;


      row.dataset.id = task.id;
      if (task.done) row.classList.add("is-done");
      if (task.priority === "high") row.classList.add("is-high", "is-important");
      if (task.priority === "low") row.classList.add("is-low");
      if (editing) row.classList.add("is-editing");

      check.checked = task.done;
      check.setAttribute("aria-label", s.complete);
      const view = displayText(task);
      text.textContent = view.text;
      if (view.translated) text.classList.add("is-translated");
      field.value = view.text;                     // you edit exactly what you see
      if (task.plan.length) {
        const done = task.plan.filter(function (p) { return p.done; }).length;
        planChip.textContent = s.planCount(done, task.plan.length);
        planChip.hidden = false;
      }
      if (editing) row.appendChild(buildPanel(task, s));
      if (task.due) {
        const badge = dueBadge(task);
        dueChip.children[0].textContent = s.due + ": ";   // for screen readers only
        dueChip.children[1].textContent = badge.text;
        if (badge.tone && !task.done) dueChip.classList.add(badge.tone);
        dueChip.hidden = false;
      }
      field.setAttribute("aria-label", s.edit);
      editBtn.setAttribute("aria-label", editing ? s.save : s.edit);
      editBtn.title = editing ? s.save : s.edit;
      delBtn.setAttribute("aria-label", s.remove);
      delBtn.title = s.remove;

      if (editing) editField = field;
      rows.set(task.id, row);
      frag.appendChild(row);
    }

    el.list.replaceChildren(frag);                 // one insertion, one reflow
    if (greetingDue()) { showWelcome(); }
    else {
      el.welcome.hidden = true;
      el.empty.hidden = visible.length > 0;
      const searching = q && state.tasks.length;
      el.emptyMood.textContent = searching ? s.noMatch(el.input.value.trim()) : MOTIVATE[state.lang][MOOD];
      el.emptyHint.textContent = searching ? "" : s.empty;
    }
    renderProgress();

    if (editField) {
      editField.focus();
      const end = editField.value.length;
      editField.setSelectionRange(end, end);
    } else {
      restoreFocus(focus);
    }
  }

  /* Completed share of the list, shown only as a filled gradient line */
  function renderProgress() {
    let done = 0;
    for (let i = 0; i < state.tasks.length; i++) if (state.tasks[i].done) done++;
    const pct = state.tasks.length ? done / state.tasks.length * 100 : 0;
    el.progress.style.width = pct ? pct.toFixed(2) + "%" : "0";
    el.progressBar.setAttribute("aria-valuenow", Math.round(pct));
    el.progressBar.setAttribute("aria-label", t().progress);
  }

  /* One panel holds every option a task has, so the list itself stays a list */
  function buildPanel(task, s) {
    const panel = el.editTpl.content.firstElementChild.cloneNode(true);
    const f = function (name) { return panel.querySelector('[data-f="' + name + '"]'); };

    f("due").value = task.due || "";
    f("due").setAttribute("aria-label", s.due);
    f("at").value = task.at || "";
    f("at").setAttribute("aria-label", s.atTime);

    const repeat = f("repeat");
    const labels = [s.noRepeat, s.hourly, s.daily, s.weekly, s.custom];
    for (let i = 0; i < repeat.options.length; i++) repeat.options[i].textContent = labels[i];
    repeat.value = task.repeat || "none";
    repeat.setAttribute("aria-label", s.repeat);

    const every = f("every");
    every.value = task.every || "";
    every.placeholder = s.everyMin;
    every.setAttribute("aria-label", s.everyMin);
    every.hidden = repeat.value !== "custom";

    const seg = panel.querySelector('[data-role="prio"]');
    const names = { high: s.high, normal: s.normal, low: s.low };
    Array.prototype.forEach.call(seg.children, function (btn) {
      btn.textContent = names[btn.dataset.v];
      btn.setAttribute("aria-pressed", task.priority === btn.dataset.v ? "true" : "false");
    });
    seg.setAttribute("aria-label", s.priority);

    panel.querySelector(".plan__label").textContent = s.plan;
    panel.querySelector('[data-action="suggest"]').textContent = s.suggest;
    panel.querySelector('[data-action="share"]').textContent = s.share;
    const stepBox = f("newstep");
    stepBox.placeholder = s.addStep;
    stepBox.setAttribute("aria-label", s.addStep);

    const list = panel.querySelector('[data-role="steps"]');
    task.plan.forEach(function (step) {
      const node = el.stepTpl.content.firstElementChild.cloneNode(true);
      node.dataset.step = step.id;
      if (step.done) node.classList.add("is-done");
      node.children[0].checked = step.done;
      node.children[0].setAttribute("aria-label", s.complete);
      node.children[1].value = step.text;
      node.children[1].setAttribute("aria-label", s.plan);
      node.children[2].setAttribute("aria-label", s.remove);
      list.appendChild(node);
    });

    editPanel = panel;
    editDue = f("due");
    editTime = f("at");
    return panel;
  }

  /* Reads the whole panel at once, so callers never juggle field arguments */
  function readPanel() {
    if (!editPanel) return null;
    const f = function (name) { return editPanel.querySelector('[data-f="' + name + '"]'); };
    return { due: f("due").value, at: f("at").value,
             repeat: f("repeat").value, every: parseInt(f("every").value, 10) };
  }

  /* Rebuilding the list would otherwise drop keyboard focus on every action */
  function captureFocus() {
    const node = document.activeElement;
    if (!node || !el.list.contains(node)) return null;
    const row = node.closest(".task");
    return row ? { id: row.dataset.id, action: node.dataset.action || null } : null;
  }

  function restoreFocus(focus) {
    if (!focus || !focus.action) return;
    const row = rows.get(focus.id);
    if (!row) return;
    const target = row.querySelector('[data-action="' + focus.action + '"]');
    if (target && target.focus) target.focus();     // found by role, not by position
  }

  /* ==========================================================
     7. TRANSLATION — optional, and never silent about the network
     ==========================================================
     Order of preference:
       1. the browser's on-device translator  (nothing leaves the device)
       2. an online service, only after the user agrees once
       3. nothing: the task keeps the words it was written in
     Results are cached on the task, so a translated list still reads offline. */
  const SERVICE = "https://api.mymemory.translated.net/get";

  function detect(text) { return ARABIC.test(text) ? "ar" : "en"; }

  /* ---- due dates -------------------------------------------------- */
  function isoDay(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
           "-" + String(d.getDate()).padStart(2, "0");
  }
  function today() { return isoDay(new Date()); }
  function validDue(v) {
    if (typeof v !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return null;
    const d = new Date(v + "T00:00:00");
    return !isNaN(d.getTime()) && isoDay(d) === v ? v : null;
  }

  function validTime(v) {
    return typeof v === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(v) ? v : null;
  }

  /* Wording and colour both come from how near the date is */
  function dueBadge(task) {
    const s = t();
    const now = today();
    if (task.due === now) return { text: s.today, tone: "is-today" };
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    if (task.due === isoDay(tomorrow)) return { text: s.tomorrow, tone: "is-today" };

    const opts = { day: "numeric", month: "short" };
    if (task.due.slice(0, 4) !== now.slice(0, 4)) opts.year = "numeric";
    const locale = state.lang === "ar" ? "ar-u-nu-latn" : "en-GB";   // latin digits in both
    let text = task.due;
    try { text = new Intl.DateTimeFormat(locale, opts).format(new Date(task.due + "T00:00:00")); }
    catch (e) { /* keep the raw date */ }
    return { text: text, tone: task.due < now ? "is-late" : "" };
  }

  function displayText(task) {
    if (task.lang === state.lang) return { text: task.text, translated: false };
    const other = task.tr[state.lang];
    return other ? { text: other, translated: true } : { text: task.text, translated: false };
  }

  async function deviceEngine(from, to) {
    if (!("Translator" in self)) return null;       // desktop Chrome today, more later
    try {
      const state_ = await self.Translator.availability({ sourceLanguage: from, targetLanguage: to });
      if (state_ === "unavailable") return null;
      const engine = await self.Translator.create({ sourceLanguage: from, targetLanguage: to });
      return function (text) { return engine.translate(text); };
    } catch (e) { return null; }
  }

  function onlineEngine(from, to) {
    if (!navigator.onLine) return null;
    return async function (text) {
      const url = SERVICE + "?q=" + encodeURIComponent(text) + "&langpair=" + from + "|" + to;
      const options = {};
      if (typeof AbortSignal !== "undefined" && AbortSignal.timeout) {
        options.signal = AbortSignal.timeout(8000);      // not in Safari before 16
      }
      const res = await fetch(url, options);
      const data = await res.json();
      const out = data && data.responseData && data.responseData.translatedText;
      if (typeof out !== "string" || !out.trim() || /^(MYMEMORY|PLEASE|QUERY LENGTH)/i.test(out)) {
        throw new Error("no translation");
      }
      return out;
    };
  }

  let busy = false;

  /* Returns how many tasks an engine actually translated. Zero means the engine
     exists but cannot deliver (no model, no network), so the caller falls back. */
  async function runEngine(engine, pending, to) {
    let count = 0;
    for (let i = 0; i < pending.length; i++) {
      if (state.lang !== to) break;                 // the user switched back mid-flight
      try {
        const out = (await engine(pending[i].text)).trim();
        if (out && out !== pending[i].text) {
          pending[i].tr[to] = out.slice(0, MAX_LEN * 2);
          count++;
        }
      } catch (e) { break; }                        // keep the original words
    }
    return count;
  }

  async function translateTasks(quiet) {
    if (busy) return;
    const to = state.lang;
    const from = to === "ar" ? "en" : "ar";
    const pending = state.tasks.filter(function (t) { return t.lang !== to && !t.tr[to]; });
    if (!pending.length) { if (stripKind === "translate") hideStrip(); return; }

    busy = true;
    let done = 0;
    const local = await deviceEngine(from, to);
    if (local) done = await runEngine(local, pending, to);

    if (!done) {                                    // the device could not help
      if (state.send === "on") {
        const online = onlineEngine(from, to);
        if (online) done = await runEngine(online, pending, to);
      } else if (!state.send && !quiet) {
        askToTranslate();
      }
    }
    busy = false;
    if (done) { saveTasks(); renderList(); }
  }

  function askToTranslate() {
    const s = t();
    stripKind = "translate";
    showStrip(s.askTranslate,
              { label: s.askYes, run: function () { answerNotice("on"); } },
              { label: s.askNo,  run: function () { answerNotice("off"); } });
  }

  function answerNotice(send) {
    state.send = send;
    write(SEND_KEY, send);
    hideStrip();
    if (send === "on") translateTasks(true);
  }

  /* ==========================================================
     8. ORDER AND SEARCH — both derived at render time only
     ==========================================================
     state.tasks always keeps the order things were added in, so undo can put a
     task back exactly where it was. What you see is a view over that list:
       important first, then soonest due, then as added, finished at the bottom. */
  function ordered() {
    return state.tasks
      .map(function (task, i) { return { task: task, i: i }; })
      .sort(function (a, b) {
        const x = a.task, y = b.task;
        if (x.done !== y.done) return x.done ? 1 : -1;
        if (!x.done) {
          const px = PRIORITIES.indexOf(x.priority), py = PRIORITIES.indexOf(y.priority);
          if (px !== py) return px - py;                // high, then normal, then low
          if (!x.due !== !y.due) return x.due ? -1 : 1;
          if (x.due && y.due && x.due !== y.due) return x.due < y.due ? -1 : 1;
        }
        return a.i - b.i;
      })
      .map(function (entry) { return entry.task; });
  }

  /* Typing in the box filters the list; Enter still adds. Arabic is folded so
     that "إنجاز" also matches "انجاز". */
  function fold(text) {
    return text.toLowerCase()
      .replace(/[\u064B-\u0652\u0670]/g, "")
      .replace(/[\u0623\u0625\u0622\u0671]/g, "\u0627")
      .replace(/\u0649/g, "\u064A")
      .replace(/\u0629/g, "\u0647")
      .replace(/\s+/g, " ")
      .trim();
  }

  function query() { return fold(el.input.value); }

  function matches(task, q) {
    if (!q) return true;
    return fold(task.text + " " + (task.tr.en || "") + " " + (task.tr.ar || "")).indexOf(q) !== -1;
  }

  /* ==========================================================
     9. REMINDERS — every layer the platform allows, and no pretending
     ==========================================================
     Without a server there is no reliable way to alert a closed app:
       · a scheduled notification (TimestampTrigger) works only where the
         browser supports it, which today is almost nowhere;
       · while the app is open, a timer does the job exactly;
       · the app icon badge survives closing, on iOS 16.4+ and desktop;
       · and whatever is missed is shown the moment the app is opened.
     Each layer is attempted, each failure is silent, none is claimed. */
  let timers = [];
  let syncPending = null;

  /* Rescheduling is never urgent, so it never sits in the render path */
  function scheduleSync() {
    if (syncPending) return;
    syncPending = setTimeout(function () { syncPending = null; syncReminders(); }, 50);
  }

  /* A date says when something is due. A time says "tell me then" — and only a
     time creates a reminder, so nothing ever pings without being asked. */
  function remindAt(item) {
    if (!item.due || !item.at || item.done) return null;
    const stamp = new Date(item.due + "T" + item.at + ":00").getTime();
    return isNaN(stamp) ? null : stamp;
  }

  function isDueBy(item, now) {                    // for the badge and the catch-up
    return !item.done && item.due && item.due <= isoDay(now);
  }

  function dueCount() {
    const now = new Date();
    return state.tasks.filter(function (task) { return isDueBy(task, now); }).length +
           state.goals.filter(function (goal) { return isDueBy(goal, now); }).length;
  }

  function updateBadge() {
    if (!navigator.setAppBadge) return;            // Android shows its own, Linux shows none
    const n = dueCount();
    try { n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } catch (e) { /* not granted */ }
  }

  function askReminders() {
    const s = t();
    stripKind = "remind";
    showStrip(s.askRemind,
              { label: s.allow,  run: allowReminders },
              { label: s.notNow, run: function () { answerReminders("off"); } });
  }

  async function allowReminders() {
    let result = "denied";
    try { result = await Notification.requestPermission(); } catch (e) { result = "denied"; }
    answerReminders(result === "granted" ? "on" : "off");
    if (result !== "granted") {                    // say why nothing will happen, and what to do
      stripKind = "blocked";
      showStrip(t().blocked, null, null, 12);
    }
  }

  function answerReminders(value) {
    state.remind = value;
    write(REMIND_KEY, value);
    hideStrip();
    syncReminders();
  }

  function canAskReminders() {
    return typeof Notification !== "undefined" && typeof Notification.requestPermission === "function";
  }

  function canNotify() {
    return state.remind === "on" && typeof Notification !== "undefined" &&
           Notification.permission === "granted";
  }

  function repeatMinutes(task) {
    if (task.repeat === "hourly") return 60;
    if (task.repeat === "daily") return 1440;
    if (task.repeat === "weekly") return 10080;
    if (task.repeat === "custom") return task.every || null;
    return null;
  }

  /* A repeating reminder keeps its place in the future until the task is done */
  function advance(task) {
    const step = repeatMinutes(task);
    let stamp = remindAt(task);
    if (!step || stamp === null) return false;
    const now = Date.now();
    while (stamp <= now) stamp += step * 60000;
    const when = new Date(stamp);
    task.due = isoDay(when);
    task.at = String(when.getHours()).padStart(2, "0") + ":" + String(when.getMinutes()).padStart(2, "0");
    return true;
  }

  function notify(task) {
    const body = t().dueBody;
    const options = { body: body, tag: task.id, icon: ICON_192, badge: ICON_192, lang: state.lang };
    if (swReg && swReg.showNotification) swReg.showNotification(task.text, options);
    else { try { new Notification(task.text, options); } catch (e) { /* not allowed here */ } }
    updateBadge();
  }

  /* Rebuilt from scratch after any change, so it can never drift from the list */
  async function syncReminders() {
    updateBadge();
    timers.forEach(clearTimeout);
    timers = [];
    if (!canNotify()) return;
    const waiting = state.tasks.concat(state.goals);
    if (!waiting.some(function (item) { return remindAt(item) !== null; })) return;

    const now = Date.now();
    const scheduled = swReg && typeof Notification !== "undefined" &&
                      "showTrigger" in Notification.prototype;

    if (scheduled) {
      try {                                        // clear what was scheduled before
        const open = await swReg.getNotifications({ includeTriggered: true });
        open.forEach(function (n) { n.close(); });
      } catch (e) { /* older browsers reject includeTriggered */ }
    }

    waiting.forEach(function (task) {
      const at = remindAt(task);
      if (at === null || at <= now) return;         // already past: handled on open
      if (scheduled) {
        try {
          swReg.showNotification(task.text, {
            body: t().dueBody, tag: task.id, icon: ICON_192, badge: ICON_192,
            showTrigger: new TimestampTrigger(at)
          });
          return;
        } catch (e) { /* fall through to a timer */ }
      }
      if (at - now < 86400000) {                    // only worth a timer within a day
        timers.push(setTimeout(function () { fireReminder(task.id); }, at - now));
      }
    });
  }

  /* The in-app half of a reminder: the moment arrives while you are looking at it */
  function fireReminder(id) {
    const task = find(id) || goalById(id);
    if (!task || task.done) return;
    notify(task);
    stripKind = "due";
    showStrip(task.text, { label: t().markDone, run: function () {
      hideStrip();
      if (find(id)) toggleTask(id);
      else { task.done = true; saveGoals(); renderGoals(); scheduleSync(); }
    } }, null, 30);
    if (task.repeat && advance(task)) commit(); else scheduleSync();
  }

  /* Anything whose moment passed while the app was closed is surfaced on open */
  function catchUpReminders() {
    let moved = false;
    state.tasks.forEach(function (task) {           // repeats catch up quietly
      if (!task.done && remindAt(task) !== null && remindAt(task) <= Date.now() && repeatMinutes(task)) {
        if (advance(task)) moved = true;
      }
    });
    const n = dueCount();
    if (n && el.strip.hidden) {
      stripKind = "due";
      showStrip(t().dueNow(n), null, null, 10);
    }
    if (moved) commit();
  }

  /* ==========================================================
     10. FIRST RUN — one link for everyone, so the app asks who this is
     ==========================================================
     A person opens the same address as everyone else. If the device has no
     name yet, the empty list makes room for the question, once. Then, where
     the platform allows it, the install is offered as a single button. */
  let installEvent = null;

  function installed() {
    try {
      return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    } catch (e) { return false; }
  }

  /* What this particular browser can actually do, said plainly */
  function installAdvice() {
    const s = t();
    const ua = navigator.userAgent;
    if (installed()) return s.installedAlready;
    if (isIOS()) return /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua) ? s.installIOSChrome : s.installIOS;
    if (/Firefox/.test(ua) && !/Mobile|Android/.test(ua)) return s.installFirefox;
    return s.installDesktop;
  }

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
           (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function showWelcome() {
    const s = t();
    el.welcomeHi.textContent = s.welcome;
    el.welcomeQ.textContent = s.askName;
    el.welcomeName.placeholder = s.yourName;
    el.welcomeGo.textContent = s.start;
    el.welcomeSkip.textContent = s.skip;
    el.welcome.hidden = false;
    el.empty.hidden = true;
  }

  function greetingDue() {
    return !hasOwner() && !read(GREET_KEY) && !state.tasks.length;
  }

  function finishWelcome(name) {
    write(GREET_KEY, "yes");
    el.welcome.hidden = true;
    if (name) setOwner(name);
    renderList();
    el.input.focus();
  }

  /* Offered once. On Chromium it is a real button; elsewhere, the steps. */
  /* The button's only job: hand straight over to the browser where it can,
     and otherwise say exactly what to press on this device. */
  function showInstall() {
    if (installEvent) { runInstall(); return; }   // the platform's own dialog, one tap
    const s = t();
    stripKind = "install";
    showStrip(installAdvice(), null, { label: s.later, run: hideStrip }, 20);
  }

  async function runInstall() {
    hideStrip();
    if (!installEvent) return;
    try {
      installEvent.prompt();
      const choice = await installEvent.userChoice;
      if (choice && choice.outcome === "accepted") write(INSTALL_KEY, "done");
    } catch (e) { /* the browser withdrew the offer */ }
    installEvent = null;
  }

  /* ==========================================================
     11. PRAYER TIMES — worked out on the device, never fetched
     ==========================================================
     The standard astronomical method: the sun's declination and the equation
     of time give solar noon, and each prayer is an hour angle away from it.

  const D2R = Math.PI / 180;
  const dSin = function (d) { return Math.sin(d * D2R); };
  const dCos = function (d) { return Math.cos(d * D2R); };
  const dTan = function (d) { return Math.tan(d * D2R); };
  const dAcos = function (x) { return Math.acos(Math.max(-1, Math.min(1, x))) / D2R; };

  function julianDay(y, m, d) {
    if (m <= 2) { y -= 1; m += 12; }
    const a = Math.floor(y / 100);
    const b = 2 - a + Math.floor(a / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + b - 1524.5;
  }

  function sunAt(jd) {
    const n = jd - 2451545.0;
    const g = (357.529 + 0.98560028 * n) % 360;
    const q = (280.459 + 0.98564736 * n) % 360;
    const lon = (q + 1.915 * dSin(g) + 0.020 * dSin(2 * g)) % 360;
    const e = 23.439 - 0.00000036 * n;
    const decl = Math.asin(dSin(e) * dSin(lon)) / D2R;
    let ra = Math.atan2(dCos(e) * dSin(lon), dCos(lon)) / D2R / 15;
    ra = (ra + 24) % 24;
    return { decl: decl, eqt: q / 15 - ra };
  }

  /* How far the chosen city is from UTC on that day, DST and all */
  function cityOffset(zone, date) {
    try {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: zone, hour12: false,
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      }).formatToParts(date).reduce(function (all, p) { all[p.type] = p.value; return all; }, {});
      const asUTC = Date.UTC(+parts.year, +parts.month - 1, +parts.day,
                             +(parts.hour % 24), +parts.minute, +parts.second);
      return Math.round((asUTC - date.getTime()) / 60000) / 60;
    } catch (e) {
      return -date.getTimezoneOffset() / 60;        // no such zone: fall back to this device
    }
  }

  function prayerTimes(date, city) {
    const lat = city[2], lng = city[3], method = METHODS[city[4]] || METHODS[1];
    const tz = cityOffset(city[5], date);           // the city's clock, not the phone's
    const jd = julianDay(date.getFullYear(), date.getMonth() + 1, date.getDate()) - lng / 360;
    const sun = sunAt(jd);
    const span = function (angle) {
      return dAcos((-dSin(angle) - dSin(lat) * dSin(sun.decl)) /
                   (dCos(lat) * dCos(sun.decl))) / 15;
    };
    const dhuhr = 12 + tz - lng / 15 - sun.eqt;
    const shadow = -Math.atan(1 / (1 + dTan(Math.abs(lat - sun.decl)))) / D2R;
    const maghrib = dhuhr + span(0.833);
    return {
      fajr: dhuhr - span(method.fajr),
      sunrise: dhuhr - span(0.833),
      dhuhr: dhuhr,
      asr: dhuhr + span(shadow),
      maghrib: maghrib,
      isha: method.ishaMinutes ? maghrib + method.ishaMinutes / 60 : dhuhr + span(method.isha)
    };
  }

  function clock(hours) {
    let mins = Math.round(hours * 60);
    mins = ((mins % 1440) + 1440) % 1440;
    const h = Math.floor(mins / 60), m = mins % 60;
    const d = new Date();
    d.setHours(h, m, 0, 0);
    try {
      return new Intl.DateTimeFormat(state.lang === "ar" ? "ar-u-nu-latn" : "en-US",
                                     { hour: "numeric", minute: "2-digit", hour12: true }).format(d);
    } catch (e) {
      return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    }
  }

  /* The five, in order, with Friday's noon prayer named for what it is */
  function prayerRows() {
    const s = t();
    const city = CITIES[state.city] || CITIES[0];
    const now = new Date();
    const times = prayerTimes(now, city);
    const local = new Date(now.getTime() + (cityOffset(city[5], now) * 60 +
                           now.getTimezoneOffset()) * 60000);
    const friday = local.getDay() === 5;
    return [
      { key: "fajr", name: s.fajr, at: times.fajr },
      { key: "dhuhr", name: friday ? s.jumua : s.dhuhr, at: times.dhuhr },
      { key: "asr", name: s.asr, at: times.asr },
      { key: "maghrib", name: s.maghrib, at: times.maghrib },
      { key: "isha", name: s.isha, at: times.isha }
    ];
  }

  function renderPrayer() {
    const s = t();
    const rows = prayerRows();
    const city = CITIES[state.city] || CITIES[0];
    const now = new Date();
    const here = new Date(now.getTime() + (cityOffset(city[5], now) * 60 +
                          now.getTimezoneOffset()) * 60000);
    const nowH = here.getHours() + here.getMinutes() / 60;
    let next = rows.findIndex(function (r) { return r.at > nowH; });

    el.prayerList.textContent = "";
    rows.forEach(function (row, i) {
      const li = document.createElement("li");
      li.className = "prayer" + (i === next ? " is-next" : "");
      const name = document.createElement("span");
      name.className = "prayer__name";
      name.textContent = row.name;
      const time = document.createElement("span");
      time.className = "prayer__time";
      time.textContent = clock(row.at);
      li.appendChild(name);
      li.appendChild(time);
      el.prayerList.appendChild(li);
    });
    el.prayerNote.textContent = s.prayerNote;
    el.athanBtn.textContent = state.athan ? s.athanOn : s.athanOff;
    el.athanBtn.setAttribute("aria-pressed", state.athan ? "true" : "false");
  }

  function cityName(i) {
    const city = CITIES[i] || CITIES[0];
    return state.lang === "ar" ? city[0] : city[1];
  }

  /* The box shows where you are; typing in it turns it into a search. */
  function fillCities() {
    el.cityPick.value = cityName(state.city);
    el.cityPick.setAttribute("aria-label", t().city);
    el.cityPick.placeholder = t().findCity;
  }

  function searchCities(term) {
    const q = fold(term);
    const hits = [];
    for (let i = 0; i < CITIES.length && hits.length < 40; i++) {
      if (fold(CITIES[i][0] + " " + CITIES[i][1]).indexOf(q) >= 0) hits.push(i);
    }
    return hits;
  }

  function showCityResults(term) {
    const hits = searchCities(term);
    el.cityList.textContent = "";
    hits.forEach(function (i) {
      const li = document.createElement("li");
      li.className = "prayer city-hit";
      li.dataset.city = i;
      const name = document.createElement("span");
      name.className = "prayer__name";
      name.textContent = cityName(i);
      li.appendChild(name);
      el.cityList.appendChild(li);
    });
    el.cityList.hidden = false;
    el.prayerList.hidden = true;
    el.prayerNote.hidden = true;
    el.cityEmpty.hidden = hits.length > 0;
    el.cityEmpty.textContent = t().noCity;
  }

  function hideCityResults() {
    el.cityList.hidden = true;
    el.prayerList.hidden = false;
    el.prayerNote.hidden = false;
    el.cityEmpty.hidden = true;
  }

  function pickCity(i) {
    state.city = i;
    write(CITY_KEY, String(i));
    fillCities();
    hideCityResults();
    renderPrayer();
    syncPrayerAlerts();
    el.cityPick.blur();
  }

  let athanTimers = [];

  function syncPrayerAlerts() {
    athanTimers.forEach(clearTimeout);
    athanTimers = [];
    if (!state.athan || typeof Notification === "undefined" || Notification.permission !== "granted") return;
    const now = new Date();
    const city = CITIES[state.city] || CITIES[0];
    const offset = cityOffset(city[5], now);
    const midnightUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    prayerRows().forEach(function (row) {
      const moment = midnightUTC + (row.at - offset) * 3600000;   // city clock -> real instant
      const wait = moment - now.getTime();
      if (wait > 0 && wait < 86400000) {
        athanTimers.push(setTimeout(function () { announcePrayer(row); }, wait));
      }
    });
  }

  function announcePrayer(row) {
    const body = t().prayerNow(row.name);
    const options = { body: body, tag: "prayer-" + row.key, icon: ICON_192, badge: ICON_192 };
    if (swReg && swReg.showNotification) swReg.showNotification(row.name, options);
    else { try { new Notification(row.name, options); } catch (e) { /* not allowed here */ } }
    if (state.tab === "prayer") renderPrayer();
    syncPrayerAlerts();
  }

  async function toggleAthan() {
    if (state.athan) {
      state.athan = false;
      write(ATHAN_KEY, "off");
      renderPrayer();
      syncPrayerAlerts();
      return;
    }
    if (typeof Notification === "undefined") { stripKind = "blocked"; showStrip(t().blocked, null, null, 12); return; }
    let result = Notification.permission;
    if (result === "default") {
      try { result = await Notification.requestPermission(); } catch (e) { result = "denied"; }
    }
    if (result !== "granted") { stripKind = "blocked"; showStrip(t().blocked, null, null, 12); return; }
    state.athan = true;
    write(ATHAN_KEY, "on");
    renderPrayer();
    syncPrayerAlerts();
  }

  /* ==========================================================
     12. GOALS — a goal, a date, and the first step. Nothing else.
     ========================================================== */
  function loadGoals() {
    try {
      const raw = JSON.parse(read(GOALS_KEY) || "[]");
      if (!Array.isArray(raw)) return [];
      return raw.reduce(function (list, item) {
        const text = item && typeof item.text === "string" ? item.text.trim() : "";
        if (text) list.push({
          id: item.id && typeof item.id === "string" ? item.id : createId(),
          text: text.slice(0, 80),
          start: validDue(item.start),
          due: validDue(item.due),
          at: validTime(item.at),
          step: typeof item.step === "string" ? item.step.trim().slice(0, 120) : "",
          done: item.done === true
        });
        return list;
      }, []);
    } catch (e) { return []; }
  }

  function saveGoals() { write(GOALS_KEY, JSON.stringify(state.goals)); }

  function addGoal() {
    const text = el.goalInput.value.trim();
    if (!text) { el.goalInput.focus(); return; }
    state.goals.push({ id: createId(), text: text.slice(0, 80), start: null,
                       due: validDue(el.goalDue.value), at: null, step: "", done: false });
    el.goalInput.value = "";
    el.goalDue.value = "";
    saveGoals();
    renderGoals();
    el.goalInput.focus();
  }

  function renderGoals() {
    const s = t();
    el.goalList.textContent = "";
    const today = new Date(); today.setHours(0, 0, 0, 0);

    state.goals.forEach(function (goal) {
      const li = document.createElement("li");
      li.className = "goal" + (goal.done ? " is-done" : "");
      li.dataset.goal = goal.id;

      const check = document.createElement("input");
      check.type = "checkbox";
      check.className = "check";
      check.checked = goal.done;
      check.dataset.g = "done";
      check.setAttribute("aria-label", s.complete);

      const body = document.createElement("span");
      body.className = "goal__body";
      const text = document.createElement("span");
      text.className = "goal__text";
      text.textContent = goal.text;
      body.appendChild(text);

      if (goal.due || goal.start) {
        const due = document.createElement("span");
        let label = "";
        if (goal.due) {
          const left = Math.round((new Date(goal.due + "T00:00:00") - today) / 86400000);
          label = left < 0 ? s.daysPast : s.daysLeft(left);
          due.className = "goal__due" + (left < 0 && !goal.done ? " is-late" : "");
        } else {
          due.className = "goal__due";
        }
        if (goal.start) {
          const from = s.started(dueBadge({ due: goal.start, done: true }).text);
          label = label ? from + " · " + label : from;
        }
        due.textContent = label;
        body.appendChild(due);
      }

      const step = document.createElement("button");
      step.type = "button";
      step.className = "goal__step" + (goal.step ? "" : " is-empty");
      step.dataset.g = "open";
      step.textContent = goal.step ? s.firstStep + ": " + goal.step : s.firstStepAsk;
      body.appendChild(step);

      const del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn btn-delete";
      del.dataset.g = "del";
      del.setAttribute("aria-label", s.remove);
      del.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/>' +
                      '<path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>';

      li.appendChild(check);
      li.appendChild(body);
      li.appendChild(del);

      if (editingGoal === goal.id) {
        li.classList.add("is-editing");
        const panel = el.goalTpl.content.firstElementChild.cloneNode(true);
        const f = function (n) { return panel.querySelector('[data-gf="' + n + '"]'); };
        const tag = function (n) { return panel.querySelector('[data-gt="' + n + '"]'); };
        tag("start").textContent = s.startDate;
        tag("end").textContent = s.endDate;
        tag("at").textContent = s.atTime;
        f("start").value = goal.start || "";
        f("start").setAttribute("aria-label", s.startDate);
        f("due").value = goal.due || "";
        f("due").setAttribute("aria-label", s.endDate);
        f("at").value = goal.at || "";
        f("at").setAttribute("aria-label", s.atTime);
        f("step").value = goal.step;
        f("step").placeholder = s.firstStepAsk;
        f("step").setAttribute("aria-label", s.firstStep);
        li.appendChild(panel);
      }
      el.goalList.appendChild(li);
    });

    el.goalEmpty.textContent = s.goalEmpty;
    el.goalEmpty.hidden = state.goals.length > 0;
    el.goalInput.placeholder = s.goalNew;
    el.goalAdd.textContent = s.goalAdd;
    el.goalDue.setAttribute("aria-label", s.due);
    el.goalDue.placeholder = s.due;
  }

  let editingGoal = null;

  function goalById(id) {
    return state.goals.find(function (g) { return g.id === id; });
  }

  function showTab(name) {
    state.tab = name;
    write(TAB_KEY, name);
    el.viewTasks.hidden = name !== "tasks";
    el.viewPrayer.hidden = name !== "prayer";

      btn.setAttribute("aria-selected", btn.dataset.tab === name ? "true" : "false");

    if (name === "prayer") renderPrayer();
    if (name === "goals") renderGoals();

    const s = t();
    const names = { tasks: s.tabTasks, prayer: s.tabPrayer, goals: s.tabGoals };
    Array.prototype.forEach.call(el.tabs.children, function (btn) {
      btn.textContent = names[btn.dataset.tab];
