<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDECE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A24" media="(prefers-color-scheme: dark)">
<meta name="description" content="A personal to-do list that works offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" id="iosTitle" content="">
<title>To do list</title>

<!-- Language is applied before first paint so an Arabic user never sees an LTR flash.
     This is the only place the language is detected; the app reads it back from <html>. -->
<script>
try {
  var saved = localStorage.getItem("todo.lang");
  if (saved !== "ar" && saved !== "en") {
    saved = (navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en";
  }
  document.documentElement.lang = saved;
  document.documentElement.dir = saved === "ar" ? "rtl" : "ltr";
} catch (e) { /* storage blocked: stay with the English default */ }
</script>

<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root{
  color-scheme:light;
  /* Three stops sampled straight from the logo: the swoosh runs deep -> sky */
  --brand-deep:#16324F;
  --brand-mid:#2C5578;
  --brand-sky:#5DA6C8;

  --bg:#EDECE7;              /* the logo's paper */
  --surface:#FFFFFF;
  --ink:#182E46;             /* wordmark navy */
  --muted:#64717F;
  --line:#E2E1DA;
  --accent:var(--brand-mid); /* blue = you can act on this */
  --accent-strong:#22466A;
  --accent-soft:#E4EBF2;
  --on-accent:#FFFFFF;
  --done-bg:#F4F8FB;         /* finished work recedes */
  --danger:#A0564E;          /* the only warm hue: destructive actions */
  --danger-soft:#F6E9E7;

  --r-lg:18px;
  --r-md:12px;
  --tap:48px;
  --pad:14px;
  --gap:10px;
  --fs:16px;                       /* 16px min: stops iOS zooming on focus */
}
html[lang="ar"]{--fs:17px}         /* Arabic needs slightly more optical size */

/* Same system, re-lit for dark rooms. Every pair below was contrast-checked. */
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --brand-deep:#3E7BA8;
    --brand-sky:#9AD0EA;
    --bg:#0F1A24;
    --surface:#16232F;
    --ink:#E7EDF3;
    --muted:#93A3B3;
    --line:#26374A;
    --accent:#7CB2D8;
    --accent-strong:#9AC6E4;
    --accent-soft:#1D3446;
    --on-accent:#0F1A24;     /* light blue needs dark text on it, not white */
    --done-bg:#131E29;
    --danger:#D9938A;
    --danger-soft:#2E2020;
  }
}
@media (min-width:600px){
  :root{--pad:20px;--gap:12px;--fs:17px}
  html[lang="ar"]{--fs:18px}
}

/* ============================================================
   2. BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  overflow:hidden;                 /* the page itself never scrolls */
  overscroll-behavior:none;        /* no pull-to-refresh or rubber-banding */
  display:flex;
  justify-content:center;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic",Tahoma,sans-serif;
  font-size:var(--fs);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
html[lang="ar"] body{line-height:1.7}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ============================================================
   3. SHELL — one screen, three rows
   ============================================================ */
.app{
  width:100%;
  max-width:660px;
  height:100vh;
  height:100dvh;
  height:var(--app-h,100dvh);      /* set from the visual viewport when available */
  display:flex;
  flex-direction:column;
  gap:var(--gap);
  padding:calc(var(--pad) + env(safe-area-inset-top))
          max(var(--pad),env(safe-area-inset-right))
          calc(var(--pad) + env(safe-area-inset-bottom))
          max(var(--pad),env(safe-area-inset-left));
}

/* ============================================================
   4. HEADER
   ============================================================ */
.header{display:flex;align-items:center;justify-content:space-between;gap:var(--gap)}
/* Logo lockup: monogram, then the name over the tagline.
   Images are never mirrored in RTL — the whole block just moves to the right. */
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand picture{display:block}
.brand img{
  display:block;height:100%;width:auto;
  user-select:none;-webkit-user-drag:none;
  -webkit-touch-callout:none;      /* a long press must not open the image menu */
}
.brand__text{cursor:pointer}
.brand__mark{height:clamp(30px,8.4vw,36px)}
.brand__word{height:clamp(14px,3.8vw,17px)}
.brand__word[hidden]{display:none}
.brand__mark[hidden]{display:none}
.brand__name{                      /* used when a brand has no wordmark image */
  font-size:clamp(1.05rem,4.4vw,1.3rem);
  font-weight:650;
  line-height:1.1;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.brand__name[hidden]{display:none}
.brand__edit{
  width:9ch;
  height:26px;
  padding-inline:6px;
  border:1px solid var(--accent);
  border-radius:7px;
  background:var(--surface);
  color:var(--ink);
  font:inherit;
  font-size:clamp(.95rem,3.8vw,1.15rem);
  font-weight:650;
}
.brand__edit[hidden]{display:none}
.brand__text{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand__tag{
  font-size:clamp(10px,2.7vw,11px);
  font-weight:600;
  line-height:1;
  letter-spacing:.2em;             /* echoes the spacing in the original logo */
  color:var(--accent);
  white-space:nowrap;
}
html[lang="ar"] .brand__tag{
  font-size:clamp(11px,3.1vw,12.5px);
  letter-spacing:normal;           /* tracking breaks Arabic letter joining */
  font-weight:500;
}
.header__tools{display:flex;align-items:center;gap:6px;flex:none}
.tool-btn{
  flex:none;
  width:40px;height:40px;
  display:grid;place-items:center;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  color:var(--accent);
}
.tool-btn svg{
  width:19px;height:19px;
  fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;
}
@media (hover:hover){.tool-btn:hover{background:var(--accent-soft)}}
.tool-btn:active{background:var(--accent-soft)}

.tool-btn--text{font-size:.95rem;font-weight:700;line-height:1;letter-spacing:.02em}

/* ============================================================
   5. COMPOSER
   ============================================================ */
.composer{display:flex;gap:8px}
.composer__field{position:relative;display:flex;flex:1;min-width:0}
.composer__input{
  flex:1;
  min-width:0;
  padding-inline-end:46px;         /* room for the date control */
  height:var(--tap);
  padding-inline:16px;
  border:1px solid var(--line);
  border-radius:var(--r-md);
  background:var(--surface);
  text-align:start;
}
.composer__input::placeholder{color:var(--muted)}

/* A real date input, made invisible over its own icon: native picker, no library */
.composer__date{
  position:absolute;inset-inline-end:0;top:0;
  width:46px;height:100%;
  opacity:0;
  border:0;padding:0;background:none;
  -webkit-appearance:none;appearance:none;
  cursor:pointer;
}
.composer__cal{
  position:absolute;inset-inline-end:13px;top:50%;
  transform:translateY(-50%);
  width:20px;height:20px;
  pointer-events:none;
  fill:none;stroke:var(--muted);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
.composer__field.has-date .composer__cal{stroke:var(--accent)}
.composer__date:focus-visible + .composer__cal{stroke:var(--accent)}
.composer__input:focus{outline:none;border-color:var(--accent)}
.composer__add{
  flex:none;
  height:var(--tap);
  min-width:84px;
  padding-inline:18px;
  border-radius:var(--r-md);
  background:var(--accent);
  color:var(--on-accent);
  font-weight:600;
}
@media (hover:hover){.composer__add:hover{background:var(--accent-strong)}}
.composer__add:active{background:var(--accent-strong)}

/* ============================================================
   6. TASK PANEL — the only scrollable region
   ============================================================ */
.panel{
  flex:1;
  min-height:0;                    /* lets the panel shrink instead of pushing the page */
  display:flex;
  flex-direction:column;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  overflow:hidden;                 /* keeps the progress line inside the rounded corners */
}

/* The logo's swoosh, reused as the one place colour reports state:
   how much of the list is done. No numbers, no labels. */
.progress{flex:none;height:3px;background:var(--line)}
.progress__fill{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--brand-deep),var(--brand-sky));
  transition:width .16s ease;
}
html[dir="rtl"] .progress__fill{transform:scaleX(-1)}   /* grows from the right */

.scroller{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:var(--line) transparent;
}
.scroller::-webkit-scrollbar{width:6px}
.scroller::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* One inline bar, reused by every transient message the app has */
.strip{
  flex:none;
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  background:var(--accent-soft);
  font-size:.85rem;
}
.strip[hidden]{display:none}
.strip__text{flex:1 1 150px;min-width:0}
.strip__actions{display:flex;gap:6px;margin-inline-start:auto}
.strip__btn{
  min-height:38px;
  padding-inline:12px;
  border-radius:9px;
  font-weight:600;
  color:var(--accent);
  white-space:nowrap;
}
.strip__btn--main{background:var(--accent);color:var(--on-accent)}

.list{list-style:none}
.empty{margin:auto;padding:32px 24px;text-align:center;color:var(--muted)}
.empty[hidden]{display:none}

.task{
  display:flex;
  flex-wrap:wrap;                  /* lets the date field drop to its own line when editing */
  align-items:center;
  gap:10px;
  min-height:56px;
  padding:4px 12px;
  border-bottom:1px solid var(--line);
}
.task:last-child{border-bottom:0}
@media (min-width:600px){.task{padding-inline:16px}}

/* Checkbox */
.check{
  flex:none;
  width:24px;height:24px;
  appearance:none;-webkit-appearance:none;
  border:2px solid var(--muted);
  border-radius:7px;
  background:var(--surface);
  cursor:pointer;
  position:relative;
}
.check:checked{                            /* the swoosh gradient means "done" */
  background-image:linear-gradient(135deg,var(--brand-deep),var(--brand-sky));
  border-color:var(--brand-mid);
}
.check:checked::after{                     /* direction-neutral: centred, never mirrored */
  content:"";
  position:absolute;
  top:50%;left:50%;
  width:5px;height:10px;
  border:solid var(--on-accent);
  border-width:0 2px 2px 0;
  transform:translate(-50%,-58%) rotate(45deg);
}

/* Task text / inline edit field */
.task__body{
  flex:1;
  cursor:pointer;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:1px;
  padding-block:9px;
}
.task__text{
  text-align:start;
  overflow-wrap:anywhere;
}

/* How near the date is decides its colour: overdue, due now, or simply noted */
.task__due{
  font-size:.76rem;
  line-height:1.35;
  text-align:start;
  color:var(--muted);
}
.task__due[hidden]{display:none}
.task__due.is-today{color:var(--accent);font-weight:600}
.task__due.is-late{color:var(--danger);font-weight:600}
.task.is-done .task__due{color:var(--muted);font-weight:400}

.sr-only{
  position:absolute;width:1px;height:1px;
  padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* An important task keeps its mark in the margin: no width taken from the text */
.task{position:relative}
.task.is-important::before{
  content:"";
  position:absolute;inset-block:0;inset-inline-start:0;
  width:3px;
  background:var(--accent);
}

/* The number doubles as the priority mark: one element, two facts */
.task__no{
  flex:none;
  min-width:1.5em;
  text-align:end;
  font-size:.74rem;
  font-variant-numeric:tabular-nums;
  color:var(--muted);
  opacity:.75;
}
.task.is-high .task__no{color:var(--accent);font-weight:700;opacity:1}
.task.is-low .task__no{opacity:.4}
.task.is-done .task__no{opacity:.4;color:var(--muted);font-weight:400}

.task__plan{font-size:.74rem;color:var(--muted)}
.task__plan[hidden]{display:none}

/* Edit panel — the one place every extra option lives */
.edit{
  flex-basis:100%;
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-block:2px 10px;
}
.edit__row{display:flex;gap:8px}
.fld{
  flex:1;
  min-width:0;
  height:40px;
  padding-inline:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  color:var(--ink);
  font:inherit;
}
.fld--time{flex:none;width:96px}
.fld--num{flex:none;width:96px}
.fld:focus{outline:none;border-color:var(--accent)}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg__btn{
  flex:1;
  min-height:38px;
  font-size:.82rem;
  font-weight:600;
  color:var(--muted);
  background:var(--surface);
  border-inline-end:1px solid var(--line);
}
.seg__btn:last-child{border-inline-end:0}
.seg__btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.plan{display:flex;flex-direction:column;gap:6px}
.plan__head{display:flex;align-items:center;gap:8px}
.plan__label{flex:1;font-size:.78rem;color:var(--muted)}
.linkbtn{
  min-height:36px;
  padding-inline:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  color:var(--accent);
  font-size:.82rem;
  font-weight:600;
}
.linkbtn--box{flex:none;width:44px;padding:0;font-size:1.1rem}
.linkbtn--wide{width:100%}
.plan__list{list-style:none;display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:8px}
.step__text{height:36px;font-size:.88rem}
.step .check--sm{width:20px;height:20px;border-radius:6px}
.step .check--sm:checked::after{width:4px;height:8px;border-width:0 2px 2px 0}
.icon-btn--sm{width:34px;height:34px}
.icon-btn--sm svg{width:16px;height:16px}
.step.is-done .step__text{color:var(--muted);text-decoration:line-through}
.task__star{
  flex:none;
  width:40px;height:40px;
  display:grid;place-items:center;
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--muted);
}
.task__star svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.task__star[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.task__star[aria-pressed="true"] svg{fill:currentColor}

.task__time-edit{
  flex:none;
  width:96px;
  height:40px;
  padding-inline:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  color:var(--ink);
}
.task__due-edit{
  flex:1;
  min-width:0;
  height:40px;
  padding-inline:12px;
  border:1px solid var(--accent);
  border-radius:10px;
  background:var(--surface);
  color:var(--ink);
}

.task__text.is-translated{               /* honest marker: these are not your words */
  text-decoration:underline dotted var(--muted);
  text-underline-offset:3px;
}
.task.is-done{background:var(--done-bg)}
.task.is-done .task__text{color:var(--muted);text-decoration:line-through}
.task__edit{
  display:none;
  flex:1;
  min-width:0;
  height:40px;
  padding-inline:12px;
  border:1px solid var(--accent);
  border-radius:10px;
  background:var(--surface);
  text-align:start;
}
.task__edit:focus{outline:none}
.task.is-editing .task__body{display:none}
.task.is-editing .task__edit{display:block}

/* Row buttons */
.task__actions{display:flex;flex:none}
.icon-btn{
  width:44px;height:44px;
  display:grid;place-items:center;
  border-radius:10px;
  color:var(--muted);
}
.icon-btn svg{
  width:20px;height:20px;
  fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}
.icon-save,.task.is-editing .icon-edit{display:none}
.task.is-editing .icon-save{display:block}
.task.is-editing .btn-edit{color:var(--accent);background:var(--accent-soft)}
@media (hover:hover){
  .btn-edit:hover{color:var(--accent);background:var(--accent-soft)}
  .btn-delete:hover{color:var(--danger);background:var(--danger-soft)}
}
.btn-edit:active{color:var(--accent);background:var(--accent-soft)}
.btn-delete:active{color:var(--danger);background:var(--danger-soft)}

/* ============================================================
   8. MOTION PREFERENCE
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    animation:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<main class="app">

  <header class="header">
    <h1 class="brand">
      <picture class="brand__mark">
        <source id="markDark" media="(prefers-color-scheme: dark)">
        <img id="brandMark" alt="">
      </picture>
      <span class="brand__text">
        <picture class="brand__word" id="brandWordBox">
          <source id="wordDark" media="(prefers-color-scheme: dark)">
          <img id="brandWord" alt="">
        </picture>
        <span class="brand__name" id="brandName" hidden></span>
        <input class="brand__edit" id="brandEdit" maxlength="24" hidden>
        <span class="brand__tag" id="brandTag"></span>
      </span>
    </h1>
    <span class="header__tools">
      <button class="tool-btn" id="backupBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"/><path d="m8 11 4 4 4-4"/><path d="M5 19h14"/></svg>
      </button>
      <button class="tool-btn tool-btn--text" id="langBtn" type="button">ع</button>
    </span>
  </header>

  <div class="composer">
    <span class="composer__field" id="composerField">
      <input class="composer__input" id="taskInput" type="text" maxlength="200"
             autocomplete="off" autocorrect="off" enterkeyhint="done" placeholder="What needs doing?">
      <input class="composer__date" id="taskDue" type="date">
      <svg class="composer__cal" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>
      </svg>
    </span>
    <button class="composer__add" id="addBtn" type="button">Add</button>
  </div>

  <section class="panel">
    <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <i class="progress__fill" id="progressFill"></i>
    </div>
    <div class="strip" id="strip" role="status" hidden>
      <p class="strip__text" id="stripText"></p>
      <span class="strip__actions">
        <button class="strip__btn strip__btn--main" id="stripMain" type="button" hidden></button>
        <button class="strip__btn" id="stripAlt" type="button" hidden></button>
      </span>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div class="scroller" id="scroller">
      <ul class="list" id="taskList" role="list"></ul>
      <p class="empty" id="emptyState" role="status" hidden></p>
    </div>
  </section>

  <p class="sr-only" id="live" role="status" aria-live="polite"></p>
</main>

<!-- Row blueprint: cloned per task, so no markup is ever built from strings -->
<template id="rowTemplate">
  <li class="task">
    <span class="task__no"></span>
    <input class="check" type="checkbox" data-action="toggle">
    <span class="task__body" data-action="open">
      <span class="task__text"></span>
      <span class="task__due" hidden><span class="sr-only"></span><span></span></span>
      <span class="task__plan" hidden></span>
    </span>
    <input class="task__edit" type="text" maxlength="200" autocomplete="off" enterkeyhint="done">
    <div class="task__actions">
      <button class="icon-btn btn-edit" type="button" data-action="edit">
        <svg class="icon-edit" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16v4Z"/><path d="m14 6 4 4"/></svg>
        <svg class="icon-save" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4 4 10-10"/></svg>
      </button>
      <button class="icon-btn btn-delete" type="button" data-action="delete">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>
      </button>
    </div>
  </li>
</template>

<!-- Everything that is not the task text lives here, and only for the row being

    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function write(key, value) {
    try { window.localStorage.setItem(key, value); } catch (e) { /* private mode or quota */ }
  }

  function loadTasks() {
    try { return normalize(JSON.parse(read(TASKS_KEY) || "[]")); }
    catch (e) { return []; }                       // corrupt JSON: start clean
  }

  /* Every task that enters the app — from storage or from a restored file —
     passes through here, so no external file can inject an unexpected shape. */
  function normalize(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.reduce(function (list, item) {
        const text = item && typeof item.text === "string" ? item.text.trim() : "";
        if (text) {
          const tr = {};
          if (item.tr && typeof item.tr === "object") {
            if (typeof item.tr.en === "string") tr.en = item.tr.en.slice(0, MAX_LEN * 2);
            if (typeof item.tr.ar === "string") tr.ar = item.tr.ar.slice(0, MAX_LEN * 2);
          }
          const clean = text.slice(0, MAX_LEN);
          list.push({
            due: validDue(item.due),
            at: validTime(item.at),
            priority: PRIORITIES.indexOf(item.priority) >= 0 ? item.priority
                      : (item.important === true ? "high" : "normal"),   // upgrades old lists
            repeat: REPEATS.indexOf(item.repeat) >= 0 ? item.repeat : "none",
            every: Number.isFinite(item.every) && item.every >= 5 ? Math.min(10080, Math.round(item.every)) : null,
            plan: normalizePlan(item.plan),
            id: item.id && typeof item.id === "string" ? item.id : createId(),
            text: clean,
            done: item.done === true,
            lang: item.lang === "ar" || item.lang === "en" ? item.lang : detect(clean),
            tr: tr
          });
        }
        return list;
      }, []);
  }

  function normalizePlan(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.reduce(function (list, step) {
      const text = step && typeof step.text === "string" ? step.text.trim() : "";
      if (text) list.push({ id: step.id && typeof step.id === "string" ? step.id : createId(),
                            text: text.slice(0, 120), done: step.done === true });
      return list;
    }, []).slice(0, 20);
  }

  const ICON_192 = BRAND.icon192;
  const ICON_512 = BRAND.icon512;
  const ICON_MASK = BRAND.iconMask;

  function addLink(rel, href, type) {
    const link = document.createElement("link");
    link.rel = rel;
    link.href = href;
    if (type) link.type = type;
    document.head.appendChild(link);
  }

  let swReg = null;

  function cleanName(value) {
    return String(value || "").replace(/[\u0000-\u001F<>]/g, "").trim().slice(0, 24);
  }

  /* A link like ?name=Rahaf hands this copy to someone, once. After that the
     device remembers, so the person can rename it themselves and keep it. */
  function resolveOwner() {
    let fromLink = "";
    try { fromLink = cleanName(new URLSearchParams(location.search).get("name")); } catch (e) { fromLink = ""; }
    if (fromLink && !state.owner) {
      state.owner = fromLink;
      write(OWNER_KEY, fromLink);
    }
    if (fromLink) {                                // keep the address clean afterwards
      try { history.replaceState({}, "", location.pathname + location.hash); } catch (e) { /* file:// */ }
    }
  }

  function ownerName() { return state.owner || BRAND.name[state.lang] || BRAND.name.en; }

  function startRename() {
    el.brandEdit.value = state.owner || "";
    el.brandEdit.placeholder = t().whoseName;
    el.brandEdit.setAttribute("aria-label", t().whoseName);
    el.brandEdit.hidden = false;
    el.brandName.hidden = true;
    el.logoBox.hidden = true;
    el.brandEdit.focus();
    el.brandEdit.select();
  }

  function setOwner(value) {
    const name = cleanName(value);
    state.owner = name || null;
    write(OWNER_KEY, name);
    paintBrand();
    renderChrome();
  }

  function paintBrand() {
    const ios = document.getElementById("iosTitle");
    if (ios) ios.content = state.owner || BRAND.name.en;   // home-screen label on iOS
    if (BRAND.mark) {
      el.mark.src = BRAND.mark;
      el.markDark.srcset = BRAND.markDark || BRAND.mark;
      el.mark.parentElement.hidden = false;
    } else {
      el.mark.parentElement.hidden = true;         // a name-only brand: type carries it
    }
    if (BRAND.word && !state.owner) {              // the brand's own wordmark, unless this
      el.logo.src = BRAND.word;                    // copy belongs to someone by name
      el.logoDark.srcset = BRAND.wordDark || BRAND.word;
      el.logoBox.hidden = false;
      el.brandName.hidden = true;
    } else {                                       // no wordmark: set the name in type
      el.logoBox.hidden = true;
      el.brandName.hidden = false;
    }
  }

  function setupPWA() {
    addLink("icon", ICON_192, "image/png");
    addLink("apple-touch-icon", ICON_192);

    // The manifest is generated here so the whole app stays in one file.
    // A data: manifest cannot resolve relative URLs, so every URL is absolute.
    const here = location.href.split("#")[0];
    const manifest = {
      id: here,
      name: (state.owner || BRAND.name.en) + " " + BRAND.tagline.en,
      short_name: state.owner || BRAND.name.en,
      description: "A personal to-do list. Works offline.",
      start_url: here,
      scope: here.replace(/[^/]*$/, ""),
      display: "standalone",
      background_color: "#EDECE7",
      theme_color: "#EDECE7",
      icons: [
        { src: ICON_192, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: ICON_512, sizes: "512x512", type: "image/png", purpose: "any" },
        { src: ICON_MASK, sizes: "512x512", type: "image/png", purpose: "maskable" }
      ]
    };
    addLink("manifest", "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest)));

    // Optional: if sw.js sits next to this file, it adds offline support when
    // hosted. Opened from disk or installed, the app is already self-contained.
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      navigator.serviceWorker.register("sw.js")
        .then(function (reg) { swReg = reg; syncReminders(); })
        .catch(function () { /* not deployed: reminders fall back to timers */ });
    }
  }

  /* ==========================================================
     6. RENDER
     ========================================================== */
  function renderChrome() {
    const s = t();
    el.root.lang = state.lang;
    el.root.dir = s.dir;
    const name = ownerName();
    const tag = BRAND.tagline[state.lang] || BRAND.tagline.en;
    document.title = name + " — " + tag;
    el.logo.alt = name;
    el.brandName.textContent = name;
    el.tagline.textContent = tag;
    el.langBtn.textContent = s.switchTo;
    el.langBtn.setAttribute("aria-label", s.switchLabel);
    el.backupBtn.setAttribute("aria-label", s.backup);
    el.backupBtn.title = s.backup;

    el.input.placeholder = s.placeholder;
    el.addBtn.textContent = s.add;
    el.empty.textContent = s.empty;
  }

  function renderList() {
    const s = t();
    const focus = captureFocus();
    const frag = document.createDocumentFragment();

    rows.clear();
    editField = null;
    editDue = null;
    editTime = null;
    editPanel = null;

    const q = query();
    const visible = ordered().filter(function (task) { return matches(task, q); });

    for (let i = 0; i < visible.length; i++) {
      const task = visible[i];
      const editing = task.id === state.editingId;
      const row = el.tpl.content.firstElementChild.cloneNode(true);
      const number = row.children[0];
      const check = row.children[1];
      const body = row.children[2];
      const text = body.children[0];
      const dueChip = body.children[1];
      const planChip = body.children[2];
      const field = row.children[3];
      const editBtn = row.children[4].children[0];
      const delBtn = row.children[4].children[1];
      number.textContent = i + 1;


      row.dataset.id = task.id;
      if (task.done) row.classList.add("is-done");
      if (task.priority === "high") row.classList.add("is-high", "is-important");
      if (task.priority === "low") row.classList.add("is-low");
      if (editing) row.classList.add("is-editing");

      check.checked = task.done;
      check.setAttribute("aria-label", s.complete);
      const view = displayText(task);
      text.textContent = view.text;
      if (view.translated) text.classList.add("is-translated");
      field.value = view.text;                     // you edit exactly what you see
      if (task.plan.length) {
        const done = task.plan.filter(function (p) { return p.done; }).length;
        planChip.textContent = s.planCount(done, task.plan.length);
        planChip.hidden = false;
      }
      if (editing) row.appendChild(buildPanel(task, s));
      if (task.due) {
        const badge = dueBadge(task);
        dueChip.children[0].textContent = s.due + ": ";   // for screen readers only
        dueChip.children[1].textContent = badge.text;
        if (badge.tone && !task.done) dueChip.classList.add(badge.tone);
        dueChip.hidden = false;
      }
      field.setAttribute("aria-label", s.edit);
      editBtn.setAttribute("aria-label", editing ? s.save : s.edit);
      editBtn.title = editing ? s.save : s.edit;
      delBtn.setAttribute("aria-label", s.remove);
      delBtn.title = s.remove;

      if (editing) editField = field;
      rows.set(task.id, row);
      frag.appendChild(row);
    }

    el.list.replaceChildren(frag);                 // one insertion, one reflow
    el.empty.hidden = visible.length > 0;
    el.empty.textContent = q && state.tasks.length ? s.noMatch(el.input.value.trim()) : s.empty;
    renderProgress();

    if (editField) {
      editField.focus();
      const end = editField.value.length;
      editField.setSelectionRange(end, end);
    } else {
      restoreFocus(focus);
    }
  }

  /* Completed share of the list, shown only as a filled gradient line */
  function renderProgress() {
    let done = 0;
    for (let i = 0; i < state.tasks.length; i++) if (state.tasks[i].done) done++;
    const pct = state.tasks.length ? done / state.tasks.length * 100 : 0;
    el.progress.style.width = pct ? pct.toFixed(2) + "%" : "0";
    el.progressBar.setAttribute("aria-valuenow", Math.round(pct));
    el.progressBar.setAttribute("aria-label", t().progress);
  }

  /* One panel holds every option a task has, so the list itself stays a list */
  function buildPanel(task, s) {
    const panel = el.editTpl.content.firstElementChild.cloneNode(true);
    const f = function (name) { return panel.querySelector('[data-f="' + name + '"]'); };

    f("due").value = task.due || "";
    f("due").setAttribute("aria-label", s.due);
    f("at").value = task.at || "";
    f("at").setAttribute("aria-label", s.atTime);

    const repeat = f("repeat");
    const labels = [s.noRepeat, s.hourly, s.daily, s.weekly, s.custom];
    for (let i = 0; i < repeat.options.length; i++) repeat.options[i].textContent = labels[i];
    repeat.value = task.repeat || "none";
    repeat.setAttribute("aria-label", s.repeat);

    const every = f("every");
    every.value = task.every || "";
    every.placeholder = s.everyMin;
    every.setAttribute("aria-label", s.everyMin);
    every.hidden = repeat.value !== "custom";

    const seg = panel.querySelector('[data-role="prio"]');
    const names = { high: s.high, normal: s.normal, low: s.low };
    Array.prototype.forEach.call(seg.children, function (btn) {
      btn.textContent = names[btn.dataset.v];
      btn.setAttribute("aria-pressed", task.priority === btn.dataset.v ? "true" : "false");
    });
    seg.setAttribute("aria-label", s.priority);

    panel.querySelector(".plan__label").textContent = s.plan;
    panel.querySelector('[data-action="suggest"]').textContent = s.suggest;
    panel.querySelector('[data-action="share"]').textContent = s.share;
    const stepBox = f("newstep");
    stepBox.placeholder = s.addStep;
    stepBox.setAttribute("aria-label", s.addStep);

    const list = panel.querySelector('[data-role="steps"]');
    task.plan.forEach(function (step) {
      const node = el.stepTpl.content.firstElementChild.cloneNode(true);
      node.dataset.step = step.id;
      if (step.done) node.classList.add("is-done");
      node.children[0].checked = step.done;
      node.children[0].setAttribute("aria-label", s.complete);
      node.children[1].value = step.text;
      node.children[1].setAttribute("aria-label", s.plan);
      node.children[2].setAttribute("aria-label", s.remove);
      list.appendChild(node);
    });

    editPanel = panel;
    editDue = f("due");
    editTime = f("at");
    return panel;
  }

  /* Reads the whole panel at once, so callers never juggle field arguments */
  function readPanel() {
    if (!editPanel) return null;
    const f = function (name) { return editPanel.querySelector('[data-f="' + name + '"]'); };
    return { due: f("due").value, at: f("at").value,
             repeat: f("repeat").value, every: parseInt(f("every").value, 10) };
  }

  /* Rebuilding the list would otherwise drop keyboard focus on every action */
  function captureFocus() {
    const node = document.activeElement;
    if (!node || !el.list.contains(node)) return null;
    const row = node.closest(".task");
    return row ? { id: row.dataset.id, action: node.dataset.action || null } : null;
  }

  function restoreFocus(focus) {
    if (!focus || !focus.action) return;
    const row = rows.get(focus.id);
    if (!row) return;
    const target = row.querySelector('[data-action="' + focus.action + '"]');
    if (target && target.focus) target.focus();     // found by role, not by position
  }

  /* ==========================================================
     7. TRANSLATION — optional, and never silent about the network
     ==========================================================
     Order of preference:
       1. the browser's on-device translator  (nothing leaves the device)
       2. an online service, only after the user agrees once
       3. nothing: the task keeps the words it was written in
     Results are cached on the task, so a translated list still reads offline. */
  const SERVICE = "https://api.mymemory.translated.net/get";

  function detect(text) { return ARABIC.test(text) ? "ar" : "en"; }

  /* ---- due dates -------------------------------------------------- */
  function isoDay(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
           "-" + String(d.getDate()).padStart(2, "0");
  }
  function today() { return isoDay(new Date()); }
  function validDue(v) {
    if (typeof v !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return null;
    const d = new Date(v + "T00:00:00");
    return !isNaN(d.getTime()) && isoDay(d) === v ? v : null;
  }

  function validTime(v) {
    return typeof v === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(v) ? v : null;
  }

  /* Wording and colour both come from how near the date is */
  function dueBadge(task) {
    const s = t();
    const now = today();
    if (task.due === now) return { text: s.today, tone: "is-today" };
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    if (task.due === isoDay(tomorrow)) return { text: s.tomorrow, tone: "is-today" };

    const opts = { day: "numeric", month: "short" };
    if (task.due.slice(0, 4) !== now.slice(0, 4)) opts.year = "numeric";
    const locale = state.lang === "ar" ? "ar-u-nu-latn" : "en-GB";   // latin digits in both
    let text = task.due;
    try { text = new Intl.DateTimeFormat(locale, opts).format(new Date(task.due + "T00:00:00")); }
    catch (e) { /* keep the raw date */ }
    return { text: text, tone: task.due < now ? "is-late" : "" };
  }

  function displayText(task) {
    if (task.lang === state.lang) return { text: task.text, translated: false };
    const other = task.tr[state.lang];
    return other ? { text: other, translated: true } : { text: task.text, translated: false };
  }

  async function deviceEngine(from, to) {
    if (!("Translator" in self)) return null;       // desktop Chrome today, more later
    try {
      const state_ = await self.Translator.availability({ sourceLanguage: from, targetLanguage: to });
      if (state_ === "unavailable") return null;
      const engine = await self.Translator.create({ sourceLanguage: from, targetLanguage: to });
      return function (text) { return engine.translate(text); };
    } catch (e) { return null; }
  }

  function onlineEngine(from, to) {
    if (!navigator.onLine) return null;
    return async function (text) {
      const url = SERVICE + "?q=" + encodeURIComponent(text) + "&langpair=" + from + "|" + to;
      const options = {};
      if (typeof AbortSignal !== "undefined" && AbortSignal.timeout) {
        options.signal = AbortSignal.timeout(8000);      // not in Safari before 16
      }
      const res = await fetch(url, options);
      const data = await res.json();
      const out = data && data.responseData && data.responseData.translatedText;
      if (typeof out !== "string" || !out.trim() || /^(MYMEMORY|PLEASE|QUERY LENGTH)/i.test(out)) {
        throw new Error("no translation");
      }
      return out;
    };
  }

  let busy = false;

  /* Returns how many tasks an engine actually translated. Zero means the engine
     exists but cannot deliver (no model, no network), so the caller falls back. */
  async function runEngine(engine, pending, to) {
    let count = 0;
    for (let i = 0; i < pending.length; i++) {
      if (state.lang !== to) break;                 // the user switched back mid-flight
      try {
        const out = (await engine(pending[i].text)).trim();
        if (out && out !== pending[i].text) {
          pending[i].tr[to] = out.slice(0, MAX_LEN * 2);
          count++;
        }
      } catch (e) { break; }                        // keep the original words
    }
    return count;
  }

  async function translateTasks(quiet) {
    if (busy) return;
    const to = state.lang;
    const from = to === "ar" ? "en" : "ar";
    const pending = state.tasks.filter(function (t) { return t.lang !== to && !t.tr[to]; });
    if (!pending.length) { if (stripKind === "translate") hideStrip(); return; }

    busy = true;
    let done = 0;
    const local = await deviceEngine(from, to);
    if (local) done = await runEngine(local, pending, to);

    if (!done) {                                    // the device could not help
      if (state.send === "on") {
        const online = onlineEngine(from, to);
        if (online) done = await runEngine(online, pending, to);
      } else if (!state.send && !quiet) {
        askToTranslate();
      }
    }
    busy = false;
    if (done) { saveTasks(); renderList(); }
  }

  function askToTranslate() {
    const s = t();
    stripKind = "translate";
    showStrip(s.askTranslate,
              { label: s.askYes, run: function () { answerNotice("on"); } },
              { label: s.askNo,  run: function () { answerNotice("off"); } });
  }

  function answerNotice(send) {
    state.send = send;
    write(SEND_KEY, send);
    hideStrip();
    if (send === "on") translateTasks(true);
  }

  /* ==========================================================
     8. ORDER AND SEARCH — both derived at render time only
     ==========================================================
     state.tasks always keeps the order things were added in, so undo can put a
     task back exactly where it was. What you see is a view over that list:
       important first, then soonest due, then as added, finished at the bottom. */
  function ordered() {
    return state.tasks
      .map(function (task, i) { return { task: task, i: i }; })
      .sort(function (a, b) {
        const x = a.task, y = b.task;
        if (x.done !== y.done) return x.done ? 1 : -1;
        if (!x.done) {
          const px = PRIORITIES.indexOf(x.priority), py = PRIORITIES.indexOf(y.priority);
          if (px !== py) return px - py;                // high, then normal, then low
          if (!x.due !== !y.due) return x.due ? -1 : 1;
          if (x.due && y.due && x.due !== y.due) return x.due < y.due ? -1 : 1;
        }
        return a.i - b.i;
      })
      .map(function (entry) { return entry.task; });
  }

  /* Typing in the box filters the list; Enter still adds. Arabic is folded so
     that "إنجاز" also matches "انجاز". */
  function fold(text) {
    return text.toLowerCase()
      .replace(/[\u064B-\u0652\u0670]/g, "")
      .replace(/[\u0623\u0625\u0622\u0671]/g, "\u0627")
      .replace(/\u0649/g, "\u064A")
      .replace(/\u0629/g, "\u0647")
      .replace(/\s+/g, " ")
      .trim();
  }

  function query() { return fold(el.input.value); }

  function matches(task, q) {
    if (!q) return true;
    return fold(task.text + " " + (task.tr.en || "") + " " + (task.tr.ar || "")).indexOf(q) !== -1;
  }

  /* ==========================================================
     9. REMINDERS — every layer the platform allows, and no pretending
     ==========================================================
     Without a server there is no reliable way to alert a closed app:
       · a scheduled notification (TimestampTrigger) works only where the
         browser supports it, which today is almost nowhere;
       · while the app is open, a timer does the job exactly;
       · the app icon badge survives closing, on iOS 16.4+ and desktop;
       · and whatever is missed is shown the moment the app is opened.
     Each layer is attempted, each failure is silent, none is claimed. */
  const DEFAULT_TIME = "09:00";
  let timers = [];
  let syncPending = null;

  /* Rescheduling is never urgent, so it never sits in the render path */
  function scheduleSync() {
    if (syncPending) return;
    syncPending = setTimeout(function () { syncPending = null; syncReminders(); }, 50);
  }

  function remindAt(task) {                        // ms timestamp, or null
    if (!task.due || task.done) return null;
    const stamp = new Date(task.due + "T" + (task.at || DEFAULT_TIME) + ":00").getTime();
    return isNaN(stamp) ? null : stamp;
  }

  function dueCount() {
    const now = Date.now();
    return state.tasks.filter(function (task) {
      const at = remindAt(task);
      return at !== null && at <= now;
    }).length;
  }

  function updateBadge() {
    if (!navigator.setAppBadge) return;            // Android shows its own, Linux shows none
    const n = dueCount();
    try { n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } catch (e) { /* not granted */ }
  }

  function askReminders() {
    const s = t();
    stripKind = "remind";
    showStrip(s.askRemind,
              { label: s.allow,  run: allowReminders },
              { label: s.notNow, run: function () { answerReminders("off"); } });
  }

  async function allowReminders() {
    let result = "denied";
    try { result = await Notification.requestPermission(); } catch (e) { result = "denied"; }
    answerReminders(result === "granted" ? "on" : "off");
    if (result !== "granted") {                    // say why nothing will happen, and what to do
      stripKind = "blocked";
      showStrip(t().blocked, null, null, 12);
    }
  }

  function answerReminders(value) {
    state.remind = value;
    write(REMIND_KEY, value);
    hideStrip();
    syncReminders();
  }

  function canAskReminders() {
    return typeof Notification !== "undefined" && typeof Notification.requestPermission === "function";
  }

  function canNotify() {
    return state.remind === "on" && typeof Notification !== "undefined" &&
           Notification.permission === "granted";
  }

  function repeatMinutes(task) {
    if (task.repeat === "hourly") return 60;
    if (task.repeat === "daily") return 1440;
    if (task.repeat === "weekly") return 10080;
    if (task.repeat === "custom") return task.every || null;
    return null;
  }

  /* A repeating reminder keeps its place in the future until the task is done */
  function advance(task) {
    const step = repeatMinutes(task);
    let stamp = remindAt(task);
    if (!step || stamp === null) return false;
    const now = Date.now();
    while (stamp <= now) stamp += step * 60000;
    const when = new Date(stamp);
    task.due = isoDay(when);
    task.at = String(when.getHours()).padStart(2, "0") + ":" + String(when.getMinutes()).padStart(2, "0");
    return true;
  }

  function notify(task) {
    const body = t().dueBody;
    const options = { body: body, tag: task.id, icon: ICON_192, badge: ICON_192, lang: state.lang };
    if (swReg && swReg.showNotification) swReg.showNotification(task.text, options);
    else { try { new Notification(task.text, options); } catch (e) { /* not allowed here */ } }
    updateBadge();
  }

  /* Rebuilt from scratch after any change, so it can never drift from the list */
  async function syncReminders() {
    updateBadge();
    timers.forEach(clearTimeout);
    timers = [];
    if (!canNotify()) return;
    if (!state.tasks.some(function (task) { return task.due && !task.done; })) return;

    const now = Date.now();
    const scheduled = swReg && typeof Notification !== "undefined" &&
                      "showTrigger" in Notification.prototype;

    if (scheduled) {
      try {                                        // clear what was scheduled before
        const open = await swReg.getNotifications({ includeTriggered: true });
        open.forEach(function (n) { n.close(); });
      } catch (e) { /* older browsers reject includeTriggered */ }
    }

    state.tasks.forEach(function (task) {
      const at = remindAt(task);
      if (at === null || at <= now) return;         // already past: handled on open
      if (scheduled) {
        try {
          swReg.showNotification(task.text, {
            body: t().dueBody, tag: task.id, icon: ICON_192, badge: ICON_192,
            showTrigger: new TimestampTrigger(at)
          });
          return;
        } catch (e) { /* fall through to a timer */ }
      }
      if (at - now < 86400000) {                    // only worth a timer within a day
        timers.push(setTimeout(function () { fireReminder(task.id); }, at - now));
      }
    });
  }

  /* The in-app half of a reminder: the moment arrives while you are looking at it */
  function fireReminder(id) {
    const task = find(id);
    if (!task || task.done) return;
    notify(task);
    stripKind = "due";
    showStrip(task.text, { label: t().markDone, run: function () { hideStrip(); toggleTask(id); } }, null, 30);
    if (advance(task)) commit(); else scheduleSync();
  }

  /* Anything whose moment passed while the app was closed is surfaced on open */
  function catchUpReminders() {
    let moved = false;
    state.tasks.forEach(function (task) {           // repeats catch up quietly
      if (!task.done && remindAt(task) !== null && remindAt(task) <= Date.now() && repeatMinutes(task)) {
        if (advance(task)) moved = true;
      }
    });
    const n = dueCount();
    if (n && el.strip.hidden) {
      stripKind = "due";
      showStrip(t().dueNow(n), null, null, 10);
    }
    if (moved) commit();
  }

  /* ==========================================================
     10. STRIP — one inline bar shared by consent, backup and undo
     ========================================================== */
  let stripKind = null;                            // which message is currently showing
  let stripRuns = { main: null, alt: null };
  let stripTimer = null;

  function showStrip(text, main, alt, seconds) {
    clearTimeout(stripTimer);
    el.stripText.textContent = text;
    stripButton(el.stripMain, main);
    stripButton(el.stripAlt, alt);
    stripRuns = { main: main, alt: alt };
    el.strip.hidden = false;
    if (seconds) stripTimer = setTimeout(hideStrip, seconds * 1000);
  }

  function stripButton(node, action) {
    node.hidden = !action;
    if (action) node.textContent = action.label;
  }

  function hideStrip() {
    clearTimeout(stripTimer);
    el.strip.hidden = true;
    stripKind = null;
    stripRuns = { main: null, alt: null };
  }

  function stripSays(text) { el.stripText.textContent = text; }

  /* Keeps whatever is on screen in the language just switched to */
  function refreshStrip() {
    if (el.strip.hidden) return;
    if (stripKind === "backup") { hideStrip(); toggleBackup(); }
    else if (stripKind === "translate") askToTranslate();
    else if (stripKind === "undo") showUndo();
    else if (stripKind === "remind") askReminders();
  }

  /* ==========================================================
     11. BACKUP — the only way tasks can leave or re-enter the app
     ========================================================== */
  function backupPayload() {
    return JSON.stringify({
      app: "arafat-todo",
      version: 1,
      exported: new Date().toISOString(),
      tasks: state.tasks
    }, null, 2);
  }

  function backupName() {
    return "arafat-tasks-" + new Date().toISOString().slice(0, 10) + ".json";
  }

  async function exportTasks() {
    const file = new File([backupPayload()], backupName(), { type: "application/json" });

    // On phones the share sheet is the useful path (Files, Drive, chat).
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: backupName() }); stripSays(t().exported); return; }
      catch (e) { if (e && e.name === "AbortError") return; }   // user cancelled: say nothing
    }

    const url = URL.createObjectURL(file);
    const link = document.createElement("a");
    link.href = url;
    link.download = backupName();
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    stripSays(t().exported);
  }

  /* Restoring merges by id: it can only add tasks, never overwrite or delete. */
  async function importTasks(file) {
    const s = t();
    try {
      const incoming = JSON.parse(await file.text());
      const list = normalize(Array.isArray(incoming) ? incoming : incoming && incoming.tasks);
      if (!list.length) { stripSays(s.importBad); return; }

      const known = new Set(state.tasks.map(function (task) { return task.id; }));
      let added = 0;
      for (let i = 0; i < list.length; i++) {
        if (!known.has(list[i].id)) { state.tasks.push(list[i]); known.add(list[i].id); added++; }
      }
      if (added) { saveTasks(); renderList(); }
      stripSays(added ? s.imported(added) : s.importNone);
    } catch (e) {
      stripSays(s.importBad);                      // not JSON, unreadable, or the wrong file
    }
  }

  function toggleBackup() {
    if (stripKind === "backup" && !el.strip.hidden) { hideStrip(); return; }
    stripKind = "backup";
    const s = t();
    showStrip(s.backupHint(state.tasks.length),
              { label: s.doExport, run: exportTasks },
              { label: s.doImport, run: function () { el.importFile.click(); } });
  }

  /* ==========================================================
     12. ACTIONS
     ========================================================== */
  function commit() { saveTasks(); renderList(); scheduleSync(); }

  function announce(message) {
    el.live.textContent = "";                      // re-set so the same text is read again
    setTimeout(function () { el.live.textContent = message; }, 30);
  }

  function addTask() {
    const text = el.input.value.trim();            // whitespace-only is not a task
    if (!text) { el.input.focus(); return; }
    flushEdit();
    const clean = text.slice(0, MAX_LEN);
    state.tasks.push({
      id: createId(), text: clean, done: false, due: validDue(el.due.value), at: null,
      priority: "normal", repeat: "none", every: null, plan: [],
      lang: detect(clean), tr: {}
    });
    el.due.value = "";                             // the date applies to that task only
    markComposerDate();
    el.input.value = "";
    commit();
    el.scroller.scrollTop = el.scroller.scrollHeight;    // keep the new task in view
    el.input.focus();
    announce(t().added);
  }

  /* Completing moves the task to the bottom, so the list is rebuilt rather than
     patched. Focus is carried across the rebuild by renderList. */
  function toggleTask(id) {
    const task = find(id);
    if (!task) { renderList(); return; }
    task.done = !task.done;
    flushEdit();
    commit();
  }

  /* Options change the task immediately and keep the panel open, so a person can
     set several things without saving between each one */
  function setPriority(id, value) {
    const task = find(id);
    if (!task || PRIORITIES.indexOf(value) < 0) return;
    keepEditing(id, function () { task.priority = value; });
  }

  function keepEditing(id, change) {
    const text = editField ? editField.value : null;
    applyEdit(id, text);                           // fold in the panel as it stands
    change();
    state.editingId = id;                          // then reopen on the same row
    commit();
  }

  function addStep(id) {
    const task = find(id);
    const box = editPanel && editPanel.querySelector('[data-f="newstep"]');
    if (!task || !box) return;
    const text = box.value.trim();
    if (!text || task.plan.length >= 20) return;
    box.value = "";
    keepEditing(id, function () {
      task.plan.push({ id: createId(), text: text.slice(0, 120), done: false });
    });
  }

  function toggleStep(id, stepId, done) {
    const task = find(id);
    if (!task) return;
    const step = task.plan.find(function (p) { return p.id === stepId; });
    if (!step) return;
    step.done = done;                              // no repaint: the box already shows it
    saveTasks();
    const row = rows.get(id);
    if (row) {
      const node = row.querySelector('[data-step="' + stepId + '"]');
      if (node) node.classList.toggle("is-done", done);
      const chip = row.querySelector(".task__plan");
      const n = task.plan.filter(function (p) { return p.done; }).length;
      chip.textContent = t().planCount(n, task.plan.length);
    }
  }

  function removeStep(id, stepId) {
    const task = find(id);
    if (!task) return;
    keepEditing(id, function () {
      task.plan = task.plan.filter(function (p) { return p.id !== stepId; });
    });
  }

  let lastDeleted = null;                          // one step of undo, which is enough

  function deleteTask(id) {
    const at = state.tasks.findIndex(function (task) { return task.id === id; });
    if (at < 0) return;
    lastDeleted = { task: state.tasks[at], at: at };
    const neighbour = nextFocusAfter(id);
    state.tasks.splice(at, 1);
    if (state.editingId === id) state.editingId = null;
    commit();
    showUndo();
    const next = neighbour && rows.get(neighbour);
    const target = next && next.querySelector('[data-action="delete"]');
    if (target) target.focus();
    else el.input.focus();                         // list emptied: go back to the box
  }

  /* Which row should hold focus once this one disappears */
  function nextFocusAfter(id) {
    const shown = [];
    rows.forEach(function (node, key) { shown.push(key); });
    const at = shown.indexOf(id);
    if (at < 0) return null;
    return shown[at + 1] || shown[at - 1] || null;
  }

  function showUndo() {
    const s = t();
    stripKind = "undo";
    showStrip(s.deleted, { label: s.undo, run: undoDelete }, null, 8);
  }

  function undoDelete() {
    if (!lastDeleted) { hideStrip(); return; }
    state.tasks.splice(Math.min(lastDeleted.at, state.tasks.length), 0, lastDeleted.task);
    lastDeleted = null;
    hideStrip();
    commit();                                      // back exactly where it was
    announce(t().restored);
  }

  function startEdit(id) { state.editingId = id; renderList(); }

  function applyEdit(id, value) {                  // state only, no repaint
    const task = find(id);
    const text = (value || "").trim();
    const panel = readPanel();
    if (task) {
      if (text && text !== displayText(task).text) {   // your edit becomes the task's own words
        task.text = text.slice(0, MAX_LEN);
        task.lang = detect(task.text);
        task.tr = {};                              // old translations no longer describe it
      }
      if (panel) {
        task.due = validDue(panel.due);            // an empty field clears the date
        task.at = validTime(panel.at);
        task.repeat = REPEATS.indexOf(panel.repeat) >= 0 ? panel.repeat : "none";
        task.every = task.repeat === "custom" && panel.every >= 5
                     ? Math.min(10080, panel.every) : null;
        if (task.repeat === "custom" && !task.every) task.repeat = "none";
      }
    }
    if (state.editingId === id) { state.editingId = null; editPanel = null; }
  }

  function commitEdit(id, value) { applyEdit(id, value); commit(); }

  function cancelEdit() { state.editingId = null; renderList(); }

  function flushEdit() {                           // save an open edit before acting elsewhere
    if (!state.editingId || !editField) return false;
    applyEdit(state.editingId, editField.value);
    return true;
  }

  /* Chrome shrinks the layout for the on-screen keyboard because of the
     interactive-widget hint; Safari ignores that hint and lets the keyboard
     cover the page instead. The visual viewport is the one measurement both
     engines agree on, so the shell is sized from it wherever it exists. */
  function fitViewport() {
    const vv = window.visualViewport;
    if (!vv) return;
    if (vv.scale > 1.01) return;                   // pinch-zoomed: leave the layout alone
    el.root.style.setProperty("--app-h", Math.round(vv.height) + "px");
    if (window.scrollY) window.scrollTo(0, 0);     // iOS scrolls the page under the keyboard
  }

  function markComposerDate() {
    el.field.classList.toggle("has-date", !!el.due.value);
  }

  function switchLanguage() {
    state.lang = state.lang === "en" ? "ar" : "en";
    write(LANG_KEY, state.lang);
    renderChrome();
    renderList();                                  // labels are translated too
    refreshStrip();
    translateTasks(false);
  }

  function find(id) {
    return state.tasks.find(function (task) { return task.id === id; });
  }

  /* ==========================================================
     13. SUGGESTED PLAN — rules, not a model
     ==========================================================
     There is no network and no library here, so a plan is produced by matching
     the task against a small set of familiar shapes of work. It is offered as a
     starting checklist that the person then edits, not as an answer. */
  const PLAYBOOK = [
    { when: /رخص|جواز|هوي|تجديد|استخراج|licen[cs]e|passport|permit|renew|id card/i,
      ar: ["تحقّق من تاريخ الانتهاء والشروط", "جهّز الأوراق والصور المطلوبة",
           "احجز موعداً أو ادخل المنصة", "ادفع الرسوم", "استلم الوثيقة وراجع بياناتها"],
      en: ["Check the expiry date and the requirements", "Gather the documents and photos",
           "Book an appointment or open the portal", "Pay the fee", "Collect it and check the details"] },
    { when: /فاتور|سداد|دفع|قسط|إيجار|bill|invoice|pay|rent|subscription/i,
      ar: ["افتح الفاتورة وتأكد من المبلغ", "تحقّق من تاريخ الاستحقاق",
           "نفّذ الدفع", "احفظ الإيصال"],
      en: ["Open the bill and check the amount", "Note the due date",
           "Make the payment", "Save the receipt"] },
    { when: /طبيب|عياد|موعد طبي|تحليل|أشعة|دواء|doctor|clinic|dentist|appointment|medical/i,
      ar: ["اختر العيادة واحجز الموعد", "جهّز التقارير والتحاليل السابقة",
           "دوّن الأعراض والأسئلة", "اذهب في الموعد", "اتبع التعليمات بعد الزيارة"],
      en: ["Choose the clinic and book", "Bring previous reports and tests",
           "Write down symptoms and questions", "Attend the appointment", "Follow the instructions afterwards"] },
    { when: /سفر|رحل|طيران|فندق|حجز|تأشير|travel|trip|flight|hotel|visa|booking/i,
      ar: ["حدّد التواريخ والميزانية", "احجز التذاكر", "احجز الإقامة",
           "جهّز الوثائق والتأشيرة", "رتّب المواصلات", "احزم الحقيبة"],
      en: ["Fix the dates and budget", "Book the tickets", "Book the stay",
           "Sort documents and visa", "Arrange transport", "Pack"] },
    { when: /سيار|صيان|إصلاح|ورشة|زيت|إطار|car|service|repair|maintenance|oil|tyre|tire/i,
      ar: ["حدّد المطلوب بدقة", "اطلب عرض سعر من ورشة موثوقة",
           "احجز الموعد", "نفّذ الصيانة", "احتفظ بالفاتورة وسجّل الموعد القادم"],
      en: ["Define exactly what is needed", "Get a quote from a trusted shop",
           "Book the slot", "Have the work done", "Keep the invoice and note the next date"] },
    { when: /تقرير|عرض|مشروع|بحث|دراس|امتحان|report|project|presentation|study|exam|essay/i,
      ar: ["حدّد الهدف والمُخرَج المطلوب", "اجمع المصادر والبيانات",
           "ضع مخططاً بالعناوين", "اكتب المسودة الأولى", "راجع وصحّح", "سلّم قبل الموعد"],
      en: ["Define the goal and the deliverable", "Gather sources and data",
           "Outline the sections", "Write the first draft", "Revise and correct", "Submit before the deadline"] },
    { when: /اجتماع|مقابل|مكالم|عميل|meeting|call|interview|client/i,
      ar: ["حدّد الهدف من اللقاء", "أرسل الدعوة والوقت",
           "جهّز النقاط والأسئلة", "احضر اللقاء ودوّن الملاحظات", "أرسل الخلاصة والمهام"],
      en: ["Decide what the meeting is for", "Send the invitation and time",
           "Prepare the points and questions", "Attend and take notes", "Send the summary and actions"] },
    { when: /شراء|تسوق|سوق|طلب|بقال|buy|shop|groceries|order|purchase/i,
      ar: ["اكتب قائمة بما تحتاجه", "قارن الأسعار",
           "حدّد الميزانية", "نفّذ الشراء", "تحقّق من الطلب عند الاستلام"],
      en: ["List what you need", "Compare prices",
           "Set a budget", "Buy", "Check the order on arrival"] },
    { when: /تنظيف|ترتيب|بيت|غرف|clean|tidy|house|room|laundry/i,
      ar: ["قسّم المكان إلى أجزاء", "أخرج ما لا تحتاجه",
           "نظّف جزءاً جزءاً", "أعد ترتيب الأغراض"],
      en: ["Split the space into parts", "Take out what is not needed",
           "Clean one part at a time", "Put things back in order"] }
  ];

  const GENERIC = {
    ar: ["وضّح المطلوب بالضبط", "اجمع ما تحتاجه قبل البدء",
         "قسّمها إلى خطوتين أو ثلاث", "نفّذ أول خطوة اليوم", "راجع النتيجة وأغلق المهمة"],
    en: ["Write down exactly what is required", "Gather what you need before starting",
         "Split it into two or three moves", "Do the first one today", "Check the result and close it"]
  };

  function planFor(task) {
    const source = task.text + " " + (task.tr.en || "") + " " + (task.tr.ar || "");
    const lang = state.lang === "ar" ? "ar" : "en";
    for (let i = 0; i < PLAYBOOK.length; i++) {
      if (PLAYBOOK[i].when.test(source)) return PLAYBOOK[i][lang];
    }
    return GENERIC[lang];
  }

  function suggestPlan(id) {
    const task = find(id);
    if (!task) return;
    const existing = task.plan.map(function (p) { return p.text; });
    const additions = planFor(task).filter(function (text) { return existing.indexOf(text) < 0; });
    if (!additions.length) return;
    keepEditing(id, function () {
      additions.forEach(function (text) {
        if (task.plan.length < 20) task.plan.push({ id: createId(), text: text, done: false });
      });
    });
  }

  /* ==========================================================
     14. SHARE — a drawn card, so what is sent looks like the app
     ========================================================== */
  function wrapText(ctx, text, width) {
    const words = String(text).split(/\s+/);
    const lines = [];
    let line = "";
    words.forEach(function (word) {
      const next = line ? line + " " + word : word;
      if (ctx.measureText(next).width > width && line) { lines.push(line); line = word; }
      else line = next;
    });
    if (line) lines.push(line);
    return lines;
  }

  function drawCard(task) {
    const s = t();
    const rtl = state.lang === "ar";
    const W = 1000, pad = 72, inner = W - pad * 2;
    const measure = document.createElement("canvas").getContext("2d");
    const font = getComputedStyle(document.body).fontFamily;

    measure.font = "600 58px " + font;
    const titleLines = wrapText(measure, task.text, inner - 40);
    const steps = task.plan.slice(0, 8);
    const H = 300 + titleLines.length * 74 + (task.due ? 60 : 0) + (steps.length ? 60 + steps.length * 56 : 0) + 120;

    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    const css = getComputedStyle(document.documentElement);
    const tone = function (name, fallback) { return (css.getPropertyValue(name) || fallback).trim(); };

    ctx.fillStyle = tone("--bg", "#EEEEEE");
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = tone("--surface", "#FFFFFF");
    roundRect(ctx, pad / 2, pad / 2, W - pad, H - pad, 36);
    ctx.fill();

    const accent = tone("--accent", "#333333");
    ctx.fillStyle = accent;
    roundRect(ctx, pad / 2, pad / 2, W - pad, 12, 8);
    ctx.fill();

    ctx.direction = rtl ? "rtl" : "ltr";
    ctx.textAlign = rtl ? "right" : "left";
    const x = rtl ? W - pad : pad;
    let y = pad + 96;

    ctx.font = "700 30px " + font;                 // priority chip
    ctx.fillStyle = task.priority === "high" ? accent : tone("--muted", "#777777");
    ctx.fillText(s.priority + ": " + s[task.priority], x, y);
    y += 78;

    ctx.font = "600 58px " + font;
    ctx.fillStyle = tone("--ink", "#111111");
    titleLines.forEach(function (line) { ctx.fillText(line, x, y); y += 74; });

    if (task.due) {
      y += 6;
      ctx.font = "500 34px " + font;
      ctx.fillStyle = dueBadge(task).tone === "is-late" ? tone("--danger", "#994444") : accent;
      ctx.fillText(s.due + ": " + dueBadge(task).text + (task.at ? " · " + task.at : ""), x, y);
      y += 46;
    }

    if (steps.length) {
      y += 40;
      ctx.font = "500 34px " + font;
      steps.forEach(function (step) {
        const dot = rtl ? x - 16 : x + 16;
        ctx.beginPath();
        ctx.arc(dot, y - 11, 13, 0, Math.PI * 2);
        ctx.fillStyle = step.done ? accent : tone("--line", "#DDDDDD");
        ctx.fill();
        ctx.fillStyle = step.done ? tone("--muted", "#777777") : tone("--ink", "#111111");
        const line = wrapText(ctx, step.text, inner - 80)[0];
        ctx.fillText(line, rtl ? x - 48 : x + 48, y);
        y += 56;
      });
    }

    ctx.font = "600 30px " + font;
    ctx.fillStyle = tone("--muted", "#777777");
    ctx.fillText(BRAND.name[state.lang] + " · " + BRAND.tagline[state.lang], x, H - pad - 6);
    return c;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function shareLines(task) {
    const s = t();
    const parts = [task.text, s.priority + ": " + s[task.priority]];
    if (task.due) parts.push(s.due + ": " + dueBadge(task).text + (task.at ? " " + task.at : ""));
    task.plan.forEach(function (p, i) { parts.push((i + 1) + ". " + p.text); });
    return parts.join("\n");
  }

  async function shareTask(id) {
    const task = find(id);
    if (!task) return;
    const canvas = drawCard(task);
    const text = shareLines(task);
    const blob = await new Promise(function (r) { canvas.toBlob(r, "image/png"); });
    const file = blob ? new File([blob], "task.png", { type: "image/png" }) : null;

    try {
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text: text });
        return;
      }
      if (navigator.share) { await navigator.share({ text: text }); return; }
    } catch (e) {
      if (e && e.name === "AbortError") return;    // the person changed their mind
    }
    if (blob) {                                    // no share sheet: hand over the card itself
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "task.png";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }
    stripKind = "share";
    showStrip(t().shareFail, null, null, 6);
  }

  /* ==========================================================
     15. EVENTS — all row handling is delegated to the list
     ========================================================== */
  el.langBtn.addEventListener("click", switchLanguage);
  /* Tapping the name opens it for editing — the same habit as tapping a task */
  el.brandName.addEventListener("click", startRename);
  el.logoBox.addEventListener("click", startRename);
  el.brandEdit.addEventListener("keydown", function (e) {
    if (e.key === "Enter") el.brandEdit.blur();
    if (e.key === "Escape") { el.brandEdit.value = state.owner || ""; el.brandEdit.blur(); }
  });
  el.brandEdit.addEventListener("blur", function () {
    el.brandEdit.hidden = true;
    setOwner(el.brandEdit.value);
  });

  el.backupBtn.addEventListener("click", toggleBackup);
  el.stripMain.addEventListener("click", function () { if (stripRuns.main) stripRuns.main.run(); });
  el.stripAlt.addEventListener("click", function () { if (stripRuns.alt) stripRuns.alt.run(); });
  el.importFile.addEventListener("change", function () {
    const file = el.importFile.files && el.importFile.files[0];
    if (file) importTasks(file);
    el.importFile.value = "";                      // allow re-picking the same file
  });
  el.addBtn.addEventListener("click", addTask);

  el.input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addTask(); }
  });

  el.input.addEventListener("input", renderList);  // typing filters the list live
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitViewport);
    window.visualViewport.addEventListener("scroll", fitViewport);
  }
  window.addEventListener("orientationchange", function () { setTimeout(fitViewport, 250); });

  el.due.addEventListener("change", function () {
    markComposerDate();
    // iOS exposes Notification only to installed web apps, so in a tab there is
    // nothing to offer and nothing to ask about
    if (!el.due.value || !canAskReminders()) return;
    if (Notification.permission === "denied") {    // already refused at browser level
      if (!state.remind) { stripKind = "blocked"; showStrip(t().blocked, null, null, 12); write(REMIND_KEY, "off"); state.remind = "off"; }
      return;
    }
    if (!state.remind) askReminders();
  });
  el.due.addEventListener("click", function () {   // desktop: the icon is invisible, so ask directly
    if (el.due.showPicker) { try { el.due.showPicker(); } catch (e) { /* not allowed here */ } }
  });

  /* While editing, a tap on a row button must not move focus first: the blur
     would rebuild the list and swallow the click (seen on iOS Safari). */
  el.list.addEventListener("pointerdown", function (e) {
    if (state.editingId && e.target.closest("[data-action]")) e.preventDefault();
  });

  el.list.addEventListener("click", function (e) {
    const button = e.target.closest("[data-action]");
    if (!button) return;
    const row = button.closest(".task");
    if (!row) return;

    const id = row.dataset.id;
    const editingHere = state.editingId === id;

    switch (button.dataset.action) {
      case "toggle":
        toggleTask(id);                            // flushes any open edit itself
        break;
      case "edit":
        if (editingHere) { commitEdit(id, editField.value); }
        else { flushEdit(); startEdit(id); }
        break;
      case "open":
        if (!editingHere) { flushEdit(); startEdit(id); }
        break;
      case "prio":
        setPriority(id, button.dataset.v);
        break;
      case "suggest":
        suggestPlan(id);
        break;
      case "addstep":
        addStep(id);
        break;
      case "stepdone":
        toggleStep(id, button.closest(".step").dataset.step, button.checked);
        break;
      case "stepdel":
        removeStep(id, button.closest(".step").dataset.step);
        break;
      case "share":
        shareTask(id);
        break;
      case "delete":
        if (!editingHere) flushEdit();             // deleting the edited row discards its text
        deleteTask(id);
        break;
    }
  });

  el.list.addEventListener("change", function (e) {
    if (!editPanel) return;
    if (e.target.dataset.f === "repeat") {
      const every = editPanel.querySelector('[data-f="every"]');
      every.hidden = e.target.value !== "custom";
      if (!every.hidden && !every.value) every.value = 30;
    }
    if (e.target.dataset.f === "steptext") {       // step text saves quietly
      const row = e.target.closest(".task");
      const step = e.target.closest(".step");
      const task = row && find(row.dataset.id);
      const item = task && task.plan.find(function (p) { return p.id === step.dataset.step; });
      if (item) { item.text = e.target.value.trim().slice(0, 120) || item.text; saveTasks(); }
    }
  });

  el.list.addEventListener("keydown", function (e) {
    if (e.target !== editField && e.target !== editDue && e.target !== editTime) return;
    if (e.key === "Enter") {
      e.preventDefault();
      commitEdit(state.editingId, editField.value);
    } else if (e.key === "Escape") { e.preventDefault(); cancelEdit(); }
  });

  /* Leaving the field for anything outside the list saves the edit */
  el.list.addEventListener("focusout", function (e) {
    if (e.target !== editField && e.target !== editDue && e.target !== editTime) return;
    if (e.relatedTarget && e.relatedTarget.dataset && e.relatedTarget.dataset.action === "important") return;
    if (e.relatedTarget && el.list.contains(e.relatedTarget)) return;
    commitEdit(state.editingId, editField.value);
  });

  /* ==========================================================
     16. INIT
     ========================================================== */
  resolveOwner();                                  // before the manifest is built
  paintBrand();
  setupPWA();
  renderChrome();
  renderList();
  translateTasks(true);                            // quietly: never prompt on launch
  fitViewport();
  syncReminders();
  catchUpReminders();
})();
</script>
</body>
</html>
