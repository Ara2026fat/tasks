  /* ==========================================================
     14. STRIP — one inline bar shared by consent, backup and undo
     ========================================================== */
  let stripKind = null;                            // which message is currently showing
  let stripRuns = { main: null, alt: null, extra: null };
  let stripTimer = null;

  function showStrip(text, main, alt, seconds, extra) {
    clearTimeout(stripTimer);
    el.stripText.textContent = text;
    stripButton(el.stripMain, main);
    stripButton(el.stripAlt, alt);
    stripButton(el.stripExtra, extra);
    stripRuns = { main: main, alt: alt, extra: extra };
    el.strip.hidden = false;
    if (seconds) stripTimer = setTimeout(hideStrip, seconds * 1000);
  }

  function stripButton(node, action) {
    node.hidden = !action;
    if (action) node.textContent = action.label;
  }

  function hideStrip() {
    clearTimeout(stripTimer);
    el.strip.hidden = true;
    stripKind = null;
    stripRuns = { main: null, alt: null, extra: null };
  }

  function stripSays(text) { el.stripText.textContent = text; }

  /* Keeps whatever is on screen in the language just switched to */
  function refreshStrip() {
    if (el.strip.hidden) return;
    if (stripKind === "backup") { hideStrip(); toggleBackup(); }
    else if (stripKind === "translate") askToTranslate();
    else if (stripKind === "undo") showUndo();
    else if (stripKind === "remind") askReminders();
  }

  /* ==========================================================
     15. BACKUP — the only way tasks can leave or re-enter the app
     ========================================================== */
  function backupPayload() {
    return JSON.stringify({
      app: "arafat-todo",
      version: 1,
      exported: new Date().toISOString(),
      tasks: state.tasks
    }, null, 2);
  }

  function backupName() {
    return "arafat-tasks-" + new Date().toISOString().slice(0, 10) + ".json";
  }

  async function exportTasks() {
    const file = new File([backupPayload()], backupName(), { type: "application/json" });

    // On phones the share sheet is the useful path (Files, Drive, chat).
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: backupName() }); stripSays(t().exported); return; }
      catch (e) { if (e && e.name === "AbortError") return; }   // user cancelled: say nothing
    }

    const url = URL.createObjectURL(file);
    const link = document.createElement("a");
    link.href = url;
    link.download = backupName();
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    stripSays(t().exported);
  }

  /* Restoring merges by id: it can only add tasks, never overwrite or delete. */
  async function importTasks(file) {
    const s = t();
    try {
      const incoming = JSON.parse(await file.text());
      const list = normalize(Array.isArray(incoming) ? incoming : incoming && incoming.tasks);
      if (!list.length) { stripSays(s.importBad); return; }

      const known = new Set(state.tasks.map(function (task) { return task.id; }));
      let added = 0;
      for (let i = 0; i < list.length; i++) {
        if (!known.has(list[i].id)) { state.tasks.push(list[i]); known.add(list[i].id); added++; }
      }
      if (added) { saveTasks(); renderList(); }
      stripSays(added ? s.imported(added) : s.importNone);
    } catch (e) {
      stripSays(s.importBad);                      // not JSON, unreadable, or the wrong file
    }
  }

  function toggleBackup() {
    if (stripKind === "backup" && !el.strip.hidden) { hideStrip(); return; }
    stripKind = "backup";
    const s = t();
    showStrip(s.backupHint(state.tasks.length),
              { label: s.doExport, run: exportTasks },
              { label: s.doImport, run: function () { el.importFile.click(); } },
              0,
              installed() ? null : { label: s.installTitle, run: showInstall });
  }

  /* ==========================================================
     16. ACTIONS
     ========================================================== */
  function commit() { saveTasks(); renderList(); scheduleSync(); }

  function announce(message) {
    el.live.textContent = "";                      // re-set so the same text is read again
    setTimeout(function () { el.live.textContent = message; }, 30);
  }

  function addTask() {
    const text = el.input.value.trim();            // whitespace-only is not a task
    if (!text) { el.input.focus(); return; }
    flushEdit();
    const clean = text.slice(0, MAX_LEN);
    state.tasks.push({
      id: createId(), text: clean, done: false, due: validDue(el.due.value), at: null,
      priority: "normal", repeat: "none", every: null, plan: [],
      lang: detect(clean), tr: {}
    });
    el.due.value = "";                             // the date applies to that task only
    markComposerDate();
    el.input.value = "";
    commit();
    if (greetingDue()) write(GREET_KEY, "yes");    // getting straight to work is an answer too
    el.scroller.scrollTop = el.scroller.scrollHeight;    // keep the new task in view
    el.input.focus();
    announce(t().added);
  }

  /* Completing moves the task to the bottom, so the list is rebuilt rather than
     patched. Focus is carried across the rebuild by renderList. */
  function toggleTask(id) {
    const task = find(id);
    if (!task) { renderList(); return; }
    task.done = !task.done;
    flushEdit();
    commit();
  }

  /* Options change the task immediately and keep the panel open, so a person can
     set several things without saving between each one */
  function setPriority(id, value) {
    const task = find(id);
    if (!task || PRIORITIES.indexOf(value) < 0) return;
    keepEditing(id, function () { task.priority = value; });
  }

  function keepEditing(id, change) {
    const text = editField ? editField.value : null;
    applyEdit(id, text);                           // fold in the panel as it stands
    change();
    state.editingId = id;                          // then reopen on the same row
    commit();
  }

  function addStep(id) {
    const task = find(id);
    const box = editPanel && editPanel.querySelector('[data-f="newstep"]');
    if (!task || !box) return;
    const text = box.value.trim();
    if (!text || task.plan.length >= 20) return;
    box.value = "";
    keepEditing(id, function () {
      task.plan.push({ id: createId(), text: text.slice(0, 120), done: false });
    });
  }

  function toggleStep(id, stepId, done) {
    const task = find(id);
    if (!task) return;
    const step = task.plan.find(function (p) { return p.id === stepId; });
    if (!step) return;
    step.done = done;                              // no repaint: the box already shows it
    saveTasks();
    const row = rows.get(id);
    if (row) {
      const node = row.querySelector('[data-step="' + stepId + '"]');
      if (node) node.classList.toggle("is-done", done);
      const chip = row.querySelector(".task__plan");
      const n = task.plan.filter(function (p) { return p.done; }).length;
      chip.textContent = t().planCount(n, task.plan.length);
    }
  }

  function removeStep(id, stepId) {
    const task = find(id);
    if (!task) return;
    keepEditing(id, function () {
      task.plan = task.plan.filter(function (p) { return p.id !== stepId; });
    });
  }

  let lastDeleted = null;                          // one step of undo, which is enough

  function deleteTask(id) {
    const at = state.tasks.findIndex(function (task) { return task.id === id; });
    if (at < 0) return;
    lastDeleted = { task: state.tasks[at], at: at };
    const neighbour = nextFocusAfter(id);
    state.tasks.splice(at, 1);
    if (state.editingId === id) state.editingId = null;
    commit();
    showUndo();
    const next = neighbour && rows.get(neighbour);
    const target = next && next.querySelector('[data-action="delete"]');
    if (target) target.focus();
    else el.input.focus();                         // list emptied: go back to the box
  }

  /* Which row should hold focus once this one disappears */
  function nextFocusAfter(id) {
    const shown = [];
    rows.forEach(function (node, key) { shown.push(key); });
    const at = shown.indexOf(id);
    if (at < 0) return null;
    return shown[at + 1] || shown[at - 1] || null;
  }

  function showUndo() {
    const s = t();
    stripKind = "undo";
    showStrip(s.deleted, { label: s.undo, run: undoDelete }, null, 8);
  }

  function undoDelete() {
    if (!lastDeleted) { hideStrip(); return; }
    state.tasks.splice(Math.min(lastDeleted.at, state.tasks.length), 0, lastDeleted.task);
    lastDeleted = null;
    hideStrip();
    commit();                                      // back exactly where it was
    announce(t().restored);
  }

  function startEdit(id) { state.editingId = id; renderList(); }

  function applyEdit(id, value) {                  // state only, no repaint
    const task = find(id);
    const text = (value || "").trim();
    const panel = readPanel();
    if (task) {
      if (text && text !== displayText(task).text) {   // your edit becomes the task's own words
        task.text = text.slice(0, MAX_LEN);
        task.lang = detect(task.text);
        task.tr = {};                              // old translations no longer describe it
      }
      if (panel) {
        task.due = validDue(panel.due);            // an empty field clears the date
        task.at = validTime(panel.at);
        task.repeat = REPEATS.indexOf(panel.repeat) >= 0 ? panel.repeat : "none";
        task.every = task.repeat === "custom" && panel.every >= 5
                     ? Math.min(10080, panel.every) : null;
        if (task.repeat === "custom" && !task.every) task.repeat = "none";
      }
    }
    if (state.editingId === id) { state.editingId = null; editPanel = null; }
  }

  function commitEdit(id, value) { applyEdit(id, value); commit(); }

  function cancelEdit() { state.editingId = null; renderList(); }

  function flushEdit() {                           // save an open edit before acting elsewhere
    if (!state.editingId || !editField) return false;
    applyEdit(state.editingId, editField.value);
    return true;
  }

  /* Chrome shrinks the layout for the on-screen keyboard because of the
     interactive-widget hint; Safari ignores that hint and lets the keyboard
     cover the page instead. The visual viewport is the one measurement both
     engines agree on, so the shell is sized from it wherever it exists. */
  function fitViewport() {
    const vv = window.visualViewport;
    if (!vv) return;
    if (vv.scale > 1.01) return;                   // pinch-zoomed: leave the layout alone
    el.root.style.setProperty("--app-h", Math.round(vv.height) + "px");
    if (window.scrollY) window.scrollTo(0, 0);     // iOS scrolls the page under the keyboard
  }

  function markComposerDate() {
    el.field.classList.toggle("has-date", !!el.due.value);
  }

  function switchLanguage() {
    state.lang = state.lang === "en" ? "ar" : "en";
    write(LANG_KEY, state.lang);
    renderChrome();
    renderTabs();
    fillCities();
    if (state.tab === "prayer") renderPrayer();
    if (state.tab === "goals") renderGoals();
    paintBrand();                                  // the name may differ per language
    updateManifest();
    renderList();                                  // labels are translated too
    refreshStrip();
    translateTasks(false);
  }

  function find(id) {
    return state.tasks.find(function (task) { return task.id === id; });
  }

  /* ==========================================================
     17. SUGGESTED PLAN — rules, not a model
     ==========================================================
     There is no network and no library here, so a plan is produced by matching
     the task against a small set of familiar shapes of work. It is offered as a
     starting checklist that the person then edits, not as an answer. */
  const PLAYBOOK = [
    { when: /رخص|جواز|هوي|تجديد|استخراج|licen[cs]e|passport|permit|renew|id card/i,
      ar: ["تحقّق من تاريخ الانتهاء والشروط", "جهّز الأوراق والصور المطلوبة",
           "احجز موعداً أو ادخل المنصة", "ادفع الرسوم", "استلم الوثيقة وراجع بياناتها"],
      en: ["Check the expiry date and the requirements", "Gather the documents and photos",
           "Book an appointment or open the portal", "Pay the fee", "Collect it and check the details"] },
    { when: /فاتور|سداد|دفع|قسط|إيجار|bill|invoice|pay|rent|subscription/i,
      ar: ["افتح الفاتورة وتأكد من المبلغ", "تحقّق من تاريخ الاستحقاق",
           "نفّذ الدفع", "احفظ الإيصال"],
      en: ["Open the bill and check the amount", "Note the due date",
           "Make the payment", "Save the receipt"] },
    { when: /طبيب|عياد|موعد طبي|تحليل|أشعة|دواء|doctor|clinic|dentist|appointment|medical/i,
      ar: ["اختر العيادة واحجز الموعد", "جهّز التقارير والتحاليل السابقة",
           "دوّن الأعراض والأسئلة", "اذهب في الموعد", "اتبع التعليمات بعد الزيارة"],
      en: ["Choose the clinic and book", "Bring previous reports and tests",
           "Write down symptoms and questions", "Attend the appointment", "Follow the instructions afterwards"] },
    { when: /سفر|رحل|طيران|فندق|حجز|تأشير|travel|trip|flight|hotel|visa|booking/i,
      ar: ["حدّد التواريخ والميزانية", "احجز التذاكر", "احجز الإقامة",
           "جهّز الوثائق والتأشيرة", "رتّب المواصلات", "احزم الحقيبة"],
      en: ["Fix the dates and budget", "Book the tickets", "Book the stay",
           "Sort documents and visa", "Arrange transport", "Pack"] },
    { when: /سيار|صيان|إصلاح|ورشة|زيت|إطار|car|service|repair|maintenance|oil|tyre|tire/i,
      ar: ["حدّد المطلوب بدقة", "اطلب عرض سعر من ورشة موثوقة",
           "احجز الموعد", "نفّذ الصيانة", "احتفظ بالفاتورة وسجّل الموعد القادم"],
      en: ["Define exactly what is needed", "Get a quote from a trusted shop",
           "Book the slot", "Have the work done", "Keep the invoice and note the next date"] },
    { when: /تقرير|عرض|مشروع|بحث|دراس|امتحان|report|project|presentation|study|exam|essay/i,
      ar: ["حدّد الهدف والمُخرَج المطلوب", "اجمع المصادر والبيانات",
           "ضع مخططاً بالعناوين", "اكتب المسودة الأولى", "راجع وصحّح", "سلّم قبل الموعد"],
      en: ["Define the goal and the deliverable", "Gather sources and data",
           "Outline the sections", "Write the first draft", "Revise and correct", "Submit before the deadline"] },
    { when: /اجتماع|مقابل|مكالم|عميل|meeting|call|interview|client/i,
      ar: ["حدّد الهدف من اللقاء", "أرسل الدعوة والوقت",
           "جهّز النقاط والأسئلة", "احضر اللقاء ودوّن الملاحظات", "أرسل الخلاصة والمهام"],
      en: ["Decide what the meeting is for", "Send the invitation and time",
           "Prepare the points and questions", "Attend and take notes", "Send the summary and actions"] },
    { when: /شراء|تسوق|سوق|طلب|بقال|buy|shop|groceries|order|purchase/i,
      ar: ["اكتب قائمة بما تحتاجه", "قارن الأسعار",
           "حدّد الميزانية", "نفّذ الشراء", "تحقّق من الطلب عند الاستلام"],
      en: ["List what you need", "Compare prices",
           "Set a budget", "Buy", "Check the order on arrival"] },
    { when: /تنظيف|ترتيب|بيت|غرف|clean|tidy|house|room|laundry/i,
      ar: ["قسّم المكان إلى أجزاء", "أخرج ما لا تحتاجه",
           "نظّف جزءاً جزءاً", "أعد ترتيب الأغراض"],
      en: ["Split the space into parts", "Take out what is not needed",
           "Clean one part at a time", "Put things back in order"] }
  ];

  const GENERIC = {
    ar: ["وضّح المطلوب بالضبط", "اجمع ما تحتاجه قبل البدء",
         "قسّمها إلى خطوتين أو ثلاث", "نفّذ أول خطوة اليوم", "راجع النتيجة وأغلق المهمة"],
    en: ["Write down exactly what is required", "Gather what you need before starting",
         "Split it into two or three moves", "Do the first one today", "Check the result and close it"]
  };

  function planFor(task) {
    const source = task.text + " " + (task.tr.en || "") + " " + (task.tr.ar || "");
    const lang = state.lang === "ar" ? "ar" : "en";
    for (let i = 0; i < PLAYBOOK.length; i++) {
      if (PLAYBOOK[i].when.test(source)) return PLAYBOOK[i][lang];
    }
    return GENERIC[lang];
  }

  function suggestPlan(id) {
    const task = find(id);
    if (!task) return;
    const existing = task.plan.map(function (p) { return p.text; });
    const additions = planFor(task).filter(function (text) { return existing.indexOf(text) < 0; });
    if (!additions.length) return;
    keepEditing(id, function () {
      additions.forEach(function (text) {
        if (task.plan.length < 20) task.plan.push({ id: createId(), text: text, done: false });
      });
    });
  }

  /* ==========================================================
     18. SHARE — a drawn card, so what is sent looks like the app
     ========================================================== */
  function wrapText(ctx, text, width) {
    const words = String(text).split(/\s+/);
    const lines = [];
    let line = "";
    words.forEach(function (word) {
      const next = line ? line + " " + word : word;
      if (ctx.measureText(next).width > width && line) { lines.push(line); line = word; }
      else line = next;
    });
    if (line) lines.push(line);
    return lines;
  }

  function drawCard(task) {
    const s = t();
    const rtl = state.lang === "ar";
    const W = 1000, pad = 72, inner = W - pad * 2;
    const measure = document.createElement("canvas").getContext("2d");
    const font = getComputedStyle(document.body).fontFamily;

    measure.font = "600 58px " + font;
    const titleLines = wrapText(measure, task.text, inner - 40);
    const steps = task.plan.slice(0, 8);
    const H = 300 + titleLines.length * 74 + (task.due ? 60 : 0) + (steps.length ? 60 + steps.length * 56 : 0) + 120;

    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    const css = getComputedStyle(document.documentElement);
    const tone = function (name, fallback) { return (css.getPropertyValue(name) || fallback).trim(); };

    ctx.fillStyle = tone("--bg", "#EEEEEE");
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = tone("--surface", "#FFFFFF");
    roundRect(ctx, pad / 2, pad / 2, W - pad, H - pad, 36);
    ctx.fill();

    const accent = tone("--accent", "#333333");
    ctx.fillStyle = accent;
    roundRect(ctx, pad / 2, pad / 2, W - pad, 12, 8);
    ctx.fill();

    ctx.direction = rtl ? "rtl" : "ltr";
    ctx.textAlign = rtl ? "right" : "left";
    const x = rtl ? W - pad : pad;
    let y = pad + 96;

    ctx.font = "700 30px " + font;                 // priority chip
    ctx.fillStyle = task.priority === "high" ? accent : tone("--muted", "#777777");
    ctx.fillText(s.priority + ": " + s[task.priority], x, y);
    y += 78;

    ctx.font = "600 58px " + font;
    ctx.fillStyle = tone("--ink", "#111111");
    titleLines.forEach(function (line) { ctx.fillText(line, x, y); y += 74; });

    if (task.due) {
      y += 6;
      ctx.font = "500 34px " + font;
      ctx.fillStyle = dueBadge(task).tone === "is-late" ? tone("--danger", "#994444") : accent;
      ctx.fillText(s.due + ": " + dueBadge(task).text + (task.at ? " · " + task.at : ""), x, y);
      y += 46;
    }

    if (steps.length) {
      y += 40;
      ctx.font = "500 34px " + font;
      steps.forEach(function (step) {
        const dot = rtl ? x - 16 : x + 16;
        ctx.beginPath();
        ctx.arc(dot, y - 11, 13, 0, Math.PI * 2);
        ctx.fillStyle = step.done ? accent : tone("--line", "#DDDDDD");
        ctx.fill();
        ctx.fillStyle = step.done ? tone("--muted", "#777777") : tone("--ink", "#111111");
        const line = wrapText(ctx, step.text, inner - 80)[0];
        ctx.fillText(line, rtl ? x - 48 : x + 48, y);
        y += 56;
      });
    }

    ctx.font = "600 30px " + font;
    ctx.fillStyle = tone("--muted", "#777777");
    ctx.fillText(BRAND.name[state.lang] + " · " + BRAND.tagline[state.lang], x, H - pad - 6);
    return c;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function shareLines(task) {
    const s = t();
    const parts = [task.text, s.priority + ": " + s[task.priority]];
    if (task.due) parts.push(s.due + ": " + dueBadge(task).text + (task.at ? " " + task.at : ""));
    task.plan.forEach(function (p, i) { parts.push((i + 1) + ". " + p.text); });
    return parts.join("\n");
  }

  async function shareTask(id) {
    const task = find(id);
    if (!task) return;
    const canvas = drawCard(task);
    const text = shareLines(task);
    const blob = await new Promise(function (r) { canvas.toBlob(r, "image/png"); });
    const file = blob ? new File([blob], "task.png", { type: "image/png" }) : null;

    try {
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text: text });
        return;
      }
      if (navigator.share) { await navigator.share({ text: text }); return; }
    } catch (e) {
      if (e && e.name === "AbortError") return;    // the person changed their mind
    }
    if (blob) {                                    // no share sheet: hand over the card itself
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "task.png";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }
    stripKind = "share";
    showStrip(t().shareFail, null, null, 6);
  }

  /* ==========================================================
     19. EVENTS — all row handling is delegated to the list
     ========================================================== */
  el.langBtn.addEventListener("click", switchLanguage);
  /* Tapping the name opens it for editing — the same habit as tapping a task */
  el.tabs.addEventListener("click", function (e) {
    const btn = e.target.closest("[data-tab]");
    if (btn) showTab(btn.dataset.tab);
  });

  el.cityPick.addEventListener("focus", function () { el.cityPick.select(); });
  el.cityPick.addEventListener("input", function () {
    const term = el.cityPick.value.trim();
    if (term) showCityResults(term); else hideCityResults();
  });
  el.cityPick.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      const hits = searchCities(el.cityPick.value.trim());
      if (hits.length) pickCity(hits[0]);
    }
    if (e.key === "Escape") { fillCities(); hideCityResults(); el.cityPick.blur(); }
  });
  el.cityPick.addEventListener("blur", function () {
    setTimeout(function () {                       // let a tap on a result land first
      if (!el.cityList.hidden) { fillCities(); hideCityResults(); }
    }, 180);
  });
  el.cityList.addEventListener("click", function (e) {
    const row = e.target.closest("[data-city]");
    if (row) pickCity(parseInt(row.dataset.city, 10));
  });
  el.athanBtn.addEventListener("click", toggleAthan);

  el.goalAdd.addEventListener("click", addGoal);
  el.goalInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addGoal(); }
  });
  el.goalDue.addEventListener("change", function () {
    if (el.goalDue.value && !state.remind && canAskReminders()) askReminders();
  });
  el.goalList.addEventListener("click", function (e) {
    const control = e.target.closest("[data-g]");
    if (!control) return;
    const row = control.closest("[data-goal]");
    const goal = goalById(row.dataset.goal);
    if (!goal) return;
    if (control.dataset.g === "done") { goal.done = control.checked; saveGoals(); renderGoals(); scheduleSync(); }
    if (control.dataset.g === "del") {
      state.goals = state.goals.filter(function (g) { return g.id !== goal.id; });
      if (editingGoal === goal.id) editingGoal = null;
      saveGoals(); renderGoals(); scheduleSync();
    }
    if (control.dataset.g === "open") {
      editingGoal = editingGoal === goal.id ? null : goal.id;
      renderGoals();
    }
  });
  el.goalList.addEventListener("change", function (e) {
    const field = e.target.dataset.gf;
    if (!field) return;
    const row = e.target.closest("[data-goal]");
    const goal = goalById(row.dataset.goal);
    if (!goal) return;
    if (field === "start") goal.start = validDue(e.target.value);
    if (field === "due") goal.due = validDue(e.target.value);
    if (field === "at") goal.at = validTime(e.target.value);
    if (field === "step") goal.step = e.target.value.trim().slice(0, 120);
    saveGoals();
    renderGoals();
    scheduleSync();                                 // a goal can remind, like a task
  });
  el.goalList.addEventListener("keydown", function (e) {
    if (e.target.dataset.gf !== "step") return;
    if (e.key === "Enter") e.target.blur();
    if (e.key === "Escape") { editingGoal = null; renderGoals(); }
  });

  el.welcomeGo.addEventListener("click", function () { finishWelcome(el.welcomeName.value); });
  el.welcomeSkip.addEventListener("click", function () { finishWelcome(""); });
  el.welcomeName.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); finishWelcome(el.welcomeName.value); }
  });

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();                            // we choose the moment, not the browser
    installEvent = e;                              // kept for the button, shown to nobody
  });
  window.addEventListener("appinstalled", function () {
    write(INSTALL_KEY, "done");
    if (el.installBtn) el.installBtn.hidden = true;
    if (stripKind === "install") hideStrip();
  });

  el.brandName.addEventListener("click", startRename);
  el.logoBox.addEventListener("click", startRename);
  el.brandEdit.addEventListener("keydown", function (e) {
    if (e.key === "Enter") el.brandEdit.blur();
    if (e.key === "Escape") { el.brandEdit.value = state.owner[state.lang] || ""; el.brandEdit.blur(); }
  });
  el.brandEdit.addEventListener("blur", function () {
    el.brandEdit.hidden = true;
    setOwner(el.brandEdit.value);
  });

  el.installBtn.addEventListener("click", showInstall);
  el.backupBtn.addEventListener("click", toggleBackup);
  el.stripMain.addEventListener("click", function () { if (stripRuns.main) stripRuns.main.run(); });
  el.stripAlt.addEventListener("click", function () { if (stripRuns.alt) stripRuns.alt.run(); });
  el.stripExtra.addEventListener("click", function () { if (stripRuns.extra) stripRuns.extra.run(); });
  el.importFile.addEventListener("change", function () {
    const file = el.importFile.files && el.importFile.files[0];
    if (file) importTasks(file);
    el.importFile.value = "";                      // allow re-picking the same file
  });
  el.addBtn.addEventListener("click", addTask);

  el.input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addTask(); }
  });

  el.input.addEventListener("input", renderList);  // typing filters the list live
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitViewport);
    window.visualViewport.addEventListener("scroll", fitViewport);
  }
  window.addEventListener("orientationchange", function () { setTimeout(fitViewport, 250); });

  el.due.addEventListener("change", function () {
    markComposerDate();
    // iOS exposes Notification only to installed web apps, so in a tab there is
    // nothing to offer and nothing to ask about
    if (!el.due.value || !canAskReminders()) return;
    if (Notification.permission === "denied") {    // already refused at browser level
      if (!state.remind) { stripKind = "blocked"; showStrip(t().blocked, null, null, 12); write(REMIND_KEY, "off"); state.remind = "off"; }
      return;
    }
    if (!state.remind) askReminders();
  });
  el.due.addEventListener("click", function () {   // desktop: the icon is invisible, so ask directly
    if (el.due.showPicker) { try { el.due.showPicker(); } catch (e) { /* not allowed here */ } }
  });

  /* While editing, a tap on a row button must not move focus first: the blur
     would rebuild the list and swallow the click (seen on iOS Safari). */
  el.list.addEventListener("pointerdown", function (e) {
    if (state.editingId && e.target.closest("[data-action]")) e.preventDefault();
  });

  el.list.addEventListener("click", function (e) {
    const button = e.target.closest("[data-action]");
    if (!button) return;
    const row = button.closest(".task");
    if (!row) return;

    const id = row.dataset.id;
    const editingHere = state.editingId === id;

    switch (button.dataset.action) {
      case "toggle":
        toggleTask(id);                            // flushes any open edit itself
        break;
      case "edit":
        if (editingHere) { commitEdit(id, editField.value); }
        else { flushEdit(); startEdit(id); }
        break;
      case "open":
        if (!editingHere) { flushEdit(); startEdit(id); }
        break;
      case "prio":
        setPriority(id, button.dataset.v);
        break;
      case "suggest":
        suggestPlan(id);
        break;
      case "addstep":
        addStep(id);
        break;
      case "stepdone":
        toggleStep(id, button.closest(".step").dataset.step, button.checked);
        break;
      case "stepdel":
        removeStep(id, button.closest(".step").dataset.step);
        break;
      case "share":
        shareTask(id);
        break;
      case "delete":
        if (!editingHere) flushEdit();             // deleting the edited row discards its text
        deleteTask(id);
        break;
    }
  });

  el.list.addEventListener("change", function (e) {
    if (!editPanel) return;
    if (e.target.dataset.f === "repeat") {
      const every = editPanel.querySelector('[data-f="every"]');
      every.hidden = e.target.value !== "custom";
      if (!every.hidden && !every.value) every.value = 30;
    }
    if (e.target.dataset.f === "steptext") {       // step text saves quietly
      const row = e.target.closest(".task");
      const step = e.target.closest(".step");
      const task = row && find(row.dataset.id);
      const item = task && task.plan.find(function (p) { return p.id === step.dataset.step; });
      if (item) { item.text = e.target.value.trim().slice(0, 120) || item.text; saveTasks(); }
    }
  });

  el.list.addEventListener("keydown", function (e) {
    if (e.target !== editField && e.target !== editDue && e.target !== editTime) return;
    if (e.key === "Enter") {
      e.preventDefault();
      commitEdit(state.editingId, editField.value);
    } else if (e.key === "Escape") { e.preventDefault(); cancelEdit(); }
  });

  /* Leaving the field for anything outside the list saves the edit */
  el.list.addEventListener("focusout", function (e) {
    if (e.target !== editField && e.target !== editDue && e.target !== editTime) return;
    if (e.relatedTarget && e.relatedTarget.dataset && e.relatedTarget.dataset.action === "important") return;
    if (e.relatedTarget && el.list.contains(e.relatedTarget)) return;
    commitEdit(state.editingId, editField.value);
  });

  /* ==========================================================
     20. INIT
     ========================================================== */
  resolveOwner();                                  // before the manifest is built
  paintBrand();
  setupPWA();
  renderChrome();
  renderList();
  translateTasks(true);                            // quietly: never prompt on launch
  renderTabs();
  fillCities();
  showTab(state.tab);
  syncPrayerAlerts();
  fitViewport();
  syncReminders();
  catchUpReminders();
  if (installed() && el.installBtn) el.installBtn.hidden = true;   // nothing to offer
})();
</script>
</body>
</html>
